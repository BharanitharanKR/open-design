<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Kinetik — Motion Reel 2026</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Space;src:url('assets/space-grotesk.ttf') format('truetype');font-weight:300 700;font-display:block}
:root{--bg:#0B0B0C;--ink:#F2EFE8;--accent:#FF4A1C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#0B0B0C;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 15.00</span>
</div>

<script>
/* ============================================================
   Studio Kinetik — a 15-second motion designer showreel.
   One canvas, one clock: render(t) draws every frame purely
   from timeline time, so preview, scrubbing and MP4 export
   always produce identical frames.
   ============================================================ */
const CFG = {
  duration: 15, w: 1920, h: 1080, bpm: 128,
  bg: '#0B0B0C', ink: '#F2EFE8', accent: '#FF4A1C', dim: 'rgba(242,239,232,.38)', faint: 'rgba(242,239,232,.08)',
  studio: 'STUDIO KINETIK',
  scenes: [ // [start, label]
    [0, '01 — IDENTITY'], [3, '02 — TYPE'], [6, '03 — SYSTEM'], [9, '04 — DIMENSION'], [12, '05 — SIGNATURE']
  ],
  words: [['TIMING', 3.0], ['WEIGHT', 3.94], ['RHYTHM', 4.88]]
};
const BEAT = 60 / CFG.bpm;
const DISPLAY = 'Space, "Arial Black", Impact, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const E = n => gsap.parseEase(n);
const EZ = { o3: E('power3.out'), i3: E('power3.in'), io3: E('power3.inOut'), o4: E('power4.out'), expo: E('expo.out'), back: E('back.out(2.2)'), io2: E('power2.inOut') };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;

/* deterministic pseudo-random */
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

/* ---------- shared layers ---------- */
function background(t) {
  ctx.fillStyle = CFG.bg; ctx.fillRect(0, 0, CFG.w, CFG.h);
  // dot grid, slowly drifting
  ctx.fillStyle = CFG.faint;
  const off = (t * 12) % 64;
  for (let x = 32 - off; x < CFG.w; x += 64) for (let y = 32; y < CFG.h; y += 64) ctx.fillRect(x, y, 2, 2);
}
function hud(t) {
  ctx.save();
  ctx.strokeStyle = CFG.dim; ctx.lineWidth = 2;
  const m = 56, L = 36;
  [[m, m, 1, 1], [CFG.w - m, m, -1, 1], [m, CFG.h - m, 1, -1], [CFG.w - m, CFG.h - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(x, y + sy * L); ctx.lineTo(x, y); ctx.lineTo(x + sx * L, y); ctx.stroke();
  });
  ctx.font = `600 20px ${MONO}`; ctx.fillStyle = CFG.dim; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillText(CFG.studio + '  ·  MOTION REEL 2026', 112, 76);
  let label = CFG.scenes[0][1];
  for (const [s, l] of CFG.scenes) if (t >= s) label = l;
  ctx.textAlign = 'right'; ctx.fillStyle = CFG.ink; ctx.fillText(label, CFG.w - 112, 76);
  // timecode
  const s = Math.floor(t), f = Math.floor((t - s) * 30);
  ctx.textAlign = 'left'; ctx.fillStyle = CFG.dim;
  ctx.fillText(`00:00:${String(s).padStart(2, '0')}:${String(f).padStart(2, '0')}`, 112, CFG.h - 76);
  // bpm + beat squares
  const beat = Math.floor(t / BEAT) % 4, pulse = 1 - ((t / BEAT) % 1);
  ctx.textAlign = 'right'; ctx.fillText(`${CFG.bpm} BPM`, CFG.w - 112 - 4 * 22 - 18, CFG.h - 76);
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i === beat ? `rgba(255,74,28,${0.45 + 0.55 * pulse})` : CFG.faint.replace('.08', '.2');
    ctx.fillRect(CFG.w - 112 - (4 - i) * 22 + 6, CFG.h - 84, 14, 14);
  }
  // progress hairline
  ctx.fillStyle = CFG.faint.replace('.08', '.16'); ctx.fillRect(112, CFG.h - 48, CFG.w - 224, 2);
  ctx.fillStyle = CFG.accent; ctx.fillRect(112, CFG.h - 48, (CFG.w - 224) * (t / CFG.duration), 2);
  ctx.restore();
}
/* accent wipe that stitches every cut */
function wipe(t, at) {
  const p = seg(t, at - 0.16, at + 0.16);
  if (p <= 0 || p >= 1) return;
  const x0 = lerp(-200, CFG.w, EZ.io3(p));
  ctx.save(); ctx.fillStyle = CFG.accent;
  ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 260, 0); ctx.lineTo(x0 + 140, CFG.h); ctx.lineTo(x0 - 120, CFG.h); ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* ---------- 01 identity: starburst + orbit ---------- */
function starburst(cx, cy, rays, inner, outer, rot, width, color) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
  for (let i = 0; i < rays; i++) {
    const a = i / rays * TAU, len = outer * (i % 2 ? 0.72 : 1);
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner); ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); ctx.stroke();
  }
  ctx.restore();
}
function sceneIdentity(t) {
  if (t >= 3.1) return;
  const cx = 960, cy = 540;
  const grow = EZ.expo(seg(t, 0.45, 1.3));
  const collapse = EZ.i3(seg(t, 2.45, 2.95));
  const outer = lerp(0, 230, grow) * (1 - collapse);
  // dot arrives first
  const dotR = lerp(0, 14, EZ.back(seg(t, 0.1, 0.4))) * (1 - collapse * 0.4);
  ctx.fillStyle = CFG.accent; ctx.beginPath(); ctx.arc(cx, cy, dotR, 0, TAU); ctx.fill();
  if (outer > 1) starburst(cx, cy, 16, 18 * grow, outer, t * 0.35 + collapse * 1.4, 10, CFG.accent);
  // orbit circle draws on
  const ring = EZ.io3(seg(t, 0.7, 1.9));
  const R = 430 * (1 - collapse * 0.9);
  if (ring > 0) {
    ctx.save(); ctx.strokeStyle = CFG.dim; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + TAU * ring); ctx.stroke();
    // satellite on the orbit
    const a = -Math.PI / 2 + TAU * ring + t * 0.6;
    ctx.fillStyle = CFG.ink; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, 7, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // kinetic caption under the burst
  const cap = EZ.o4(seg(t, 1.3, 1.8)) * (1 - seg(t, 2.35, 2.55));
  if (cap > 0) {
    ctx.save(); ctx.globalAlpha = cap; ctx.fillStyle = CFG.ink; ctx.font = `600 26px ${MONO}`; ctx.textAlign = 'center';
    ctx.letterSpacing = lerp(30, 12, cap) + 'px';
    ctx.fillText('MOTION IS A LANGUAGE', cx, cy + 300 + (1 - cap) * 30);
    ctx.restore();
  }
}

/* ---------- 02 type: three words on the beat ---------- */
function sceneType(t) {
  if (t < 2.9 || t >= 6.1) return;
  for (let i = 0; i < CFG.words.length; i++) {
    const [word, at] = CFG.words[i];
    const end = i < CFG.words.length - 1 ? CFG.words[i + 1][1] : 5.7;
    if (t < at || t >= end + 0.4) continue;
    const pin = EZ.o4(seg(t, at, at + 0.38));
    const punch = 1 + 0.06 * Math.exp(-(t - at) * 9);
    const out = i < CFG.words.length - 1 ? 0 : EZ.i3(seg(t, 5.55, 5.95));
    if (t >= end && i < CFG.words.length - 1) continue; // hard cut
    ctx.save();
    ctx.translate(960, 560); ctx.scale(punch, punch);
    ctx.font = `700 300px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.letterSpacing = lerp(60, -12, pin) + 'px';
    // masked rise
    ctx.beginPath(); ctx.rect(-960, -170, 1920, 330); ctx.clip();
    const letters = word.split('');
    if (out > 0) {
      // the last word shatters letter by letter
      const total = ctx.measureText(word).width;
      let x = -total / 2;
      letters.forEach((ch, k) => {
        const w = ctx.measureText(ch).width;
        const d = out * (220 + rnd(k + 3) * 380);
        const ang = (rnd(k + 9) - 0.5) * 2.2;
        ctx.save(); ctx.globalAlpha = 1 - out; ctx.fillStyle = k === 2 ? CFG.accent : CFG.ink;
        ctx.translate(x + w / 2 + Math.sin(ang) * d, -Math.cos(ang) * d * (k % 2 ? 1 : -1));
        ctx.rotate(ang * out); ctx.textAlign = 'center'; ctx.fillText(ch, 0, 0); ctx.restore();
        x += w - 12;
      });
    } else {
      ctx.fillStyle = CFG.ink;
      ctx.fillText(word, 0, (1 - pin) * 320);
    }
    ctx.restore();
    // accent underline grows on each hit
    const u = EZ.expo(seg(t, at + 0.08, at + 0.5)) * (1 - out);
    ctx.fillStyle = CFG.accent; ctx.fillRect(960 - 420 * u, 760, 840 * u, 14);
    // counter
    ctx.font = `600 22px ${MONO}`; ctx.fillStyle = CFG.dim; ctx.textAlign = 'center';
    ctx.fillText(`0${i + 1} / 03`, 960, 830);
  }
}

/* ---------- 03 system: a morphing shape grid ---------- */
function shapeCell(x, y, s, morph, rot, color) {
  // morph 0 = circle, 1 = square, 2 = plus
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color;
  if (morph < 1) {
    const r = lerp(s / 2, s * 0.12, morph);
    ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, r); ctx.fill();
  } else {
    const k = morph - 1, bar = lerp(s, s * 0.3, k);
    ctx.fillRect(-s / 2, -bar / 2, s, bar);
    ctx.fillRect(-bar / 2, -s / 2, bar, s);
  }
  ctx.restore();
}
function sceneSystem(t) {
  if (t < 5.85 || t >= 9.2) return;
  const cols = 13, rows = 7, gap = 118, ox = 960 - (cols - 1) * gap / 2, oy = 540 - (rows - 1) * gap / 2;
  const intro = seg(t, 5.9, 6.5), exit = seg(t, 8.7, 9.1);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = ox + c * gap, y = oy + r * gap;
    const d = Math.hypot(c - (cols - 1) / 2, r - (rows - 1) / 2);
    const appear = EZ.back(clamp(intro * 2.2 - d * 0.12));
    const vanish = EZ.i3(clamp(exit * 2.2 - (7 - d) * 0.1));
    const wave = (t - 6.4) * 2.4 - d * 0.42;
    const morph = clamp(1 + Math.sin(wave)) * 1.0 + (Math.sin(wave) > 0.6 ? (Math.sin(wave) - 0.6) * 2.5 : 0);
    const size = 62 * appear * (1 - vanish) * (0.75 + 0.25 * Math.cos(wave));
    if (size <= 0.5) continue;
    const hot = Math.abs(((c + r + Math.floor((t - 6) / BEAT)) % 7)) === 0;
    shapeCell(x, y, size, clamp(morph, 0, 2), wave * 0.25, hot ? CFG.accent : CFG.ink);
  }
  const cap = seg(t, 6.6, 6.9) * (1 - seg(t, 8.6, 8.8));
  if (cap > 0) {
    ctx.save(); ctx.globalAlpha = cap; ctx.fillStyle = CFG.bg; ctx.fillRect(760, 506, 400, 68);
    ctx.fillStyle = CFG.ink; ctx.font = `700 40px ${DISPLAY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ONE SYSTEM', 960, 542); ctx.restore();
  }
}

/* ---------- 04 dimension: point sphere -> torus ---------- */
const PTS = (() => {
  const n = 720, pts = [], golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = golden * i;
    const sphere = [Math.cos(th) * r, y, Math.sin(th) * r];
    const u = (i % 48) / 48 * TAU, v = Math.floor(i / 48) / 15 * TAU;
    const torus = [(1 + 0.42 * Math.cos(v)) * Math.cos(u) * 0.78, 0.42 * Math.sin(v) * 0.78, (1 + 0.42 * Math.cos(v)) * Math.sin(u) * 0.78];
    pts.push({ sphere, torus });
  }
  return pts;
})();
function sceneDimension(t) {
  if (t < 8.9 || t >= 12.45) return;
  const intro = EZ.expo(seg(t, 9.0, 9.7));
  const morph = EZ.io3(seg(t, 10.2, 11.0));
  const collapse = EZ.i3(seg(t, 11.9, 12.4));
  const scale = 430 * intro * (1 - collapse * 0.97);
  const ry = (t - 9) * 1.1, rx = 0.45 + Math.sin((t - 9) * 0.8) * 0.2;
  const proj = [];
  for (const p of PTS) {
    let [x, y, z] = [0, 1, 2].map(k => lerp(p.sphere[k], p.torus[k], morph));
    let x1 = x * Math.cos(ry) + z * Math.sin(ry), z1 = -x * Math.sin(ry) + z * Math.cos(ry);
    let y1 = y * Math.cos(rx) - z1 * Math.sin(rx), z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
    const persp = 1 / (1.9 - z2 * 0.45);
    proj.push([960 + x1 * scale * persp * 1.6, 540 + y1 * scale * persp * 1.6, z2]);
  }
  proj.sort((a, b) => a[2] - b[2]);
  for (const [x, y, z] of proj) {
    const front = (z + 1) / 2;
    ctx.fillStyle = front > 0.86 ? CFG.accent : `rgba(242,239,232,${0.18 + front * 0.82})`;
    const r = 2.2 + front * 4.2;
    ctx.fillRect(x - r / 2, y - r / 2, r, r);
  }
  // orbit ring in accent
  if (intro > 0 && collapse < 1) {
    ctx.save(); ctx.strokeStyle = CFG.accent; ctx.lineWidth = 3; ctx.globalAlpha = 0.9 * (1 - collapse);
    ctx.beginPath(); ctx.ellipse(960, 540, 560 * intro, 120 * intro, -0.18, 0, TAU * EZ.io3(seg(t, 9.3, 10.4))); ctx.stroke(); ctx.restore();
  }
  const cap = seg(t, 9.6, 9.9) * (1 - seg(t, 11.6, 11.8));
  if (cap > 0) {
    ctx.save(); ctx.globalAlpha = cap; ctx.fillStyle = CFG.ink; ctx.font = `600 24px ${MONO}`; ctx.textAlign = 'left';
    ctx.fillText(morph < 0.5 ? 'SPHERE · 720 POINTS' : 'TORUS · SAME 720 POINTS', 160, 940);
    ctx.restore();
  }
}

/* ---------- 05 signature ---------- */
function sceneSignature(t) {
  if (t < 12.3) return;
  const reveal = EZ.o4(seg(t, 12.45, 13.0));
  ctx.save();
  ctx.font = `700 210px ${DISPLAY}`; ctx.textBaseline = 'alphabetic'; ctx.letterSpacing = lerp(40, -6, reveal) + 'px';
  const word = 'KINETIK';
  const w = ctx.measureText(word).width, x0 = 960 - (w + 60) / 2, base = 600;
  ctx.beginPath(); ctx.rect(0, base - 200, 1920, 250); ctx.clip();
  ctx.fillStyle = CFG.ink; ctx.textAlign = 'left';
  ctx.fillText(word, x0, base + (1 - reveal) * 240);
  ctx.restore();
  // full stop: the dot that started the reel
  const fx = 960 + (w + 60) / 2 - 18, fy = base - 22;
  const land = EZ.back(seg(t, 12.85, 13.15));
  const sx = lerp(960, fx, EZ.io3(seg(t, 12.3, 12.85))), sy = lerp(540, fy, EZ.io3(seg(t, 12.3, 12.85)));
  ctx.fillStyle = CFG.accent; ctx.beginPath(); ctx.arc(sx, sy, lerp(10, 22, land), 0, TAU); ctx.fill();
  const burst = seg(t, 13.1, 13.7);
  if (burst > 0 && burst < 1) starburst(fx, fy, 12, 30 + 40 * EZ.o3(burst), 40 + 90 * EZ.o3(burst), 0, 6 * (1 - burst), CFG.accent);
  const sub = EZ.o3(seg(t, 13.2, 13.6));
  ctx.save(); ctx.globalAlpha = sub; ctx.fillStyle = CFG.dim; ctx.font = `600 26px ${MONO}`; ctx.textAlign = 'center'; ctx.letterSpacing = '8px';
  ctx.fillText('MOTION DESIGN STUDIO  ·  SHOWREEL 2026', 960, 720 + (1 - sub) * 20);
  ctx.restore();
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  background(t);
  sceneIdentity(t);
  sceneType(t);
  sceneSystem(t);
  sceneDimension(t);
  sceneSignature(t);
  [3, 6, 9].forEach(at => wipe(t, at));
  hud(t);
}

/* ---------- master timeline: the only clock ---------- */
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);
// Plugin previews may block bundled fonts; the fallback stack then renders the film.
document.fonts.load('700 100px Space').then(() => render(tl.time()), () => render(tl.time()));

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() {
  const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h);
  main.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
window.addEventListener('resize', fit); fit();
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => {
  if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause();
  sync();
});
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(13.8); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 1.8;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
<audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="15" data-track-index="2" data-volume="1" preload="auto"></audio>
<script>
// A user gesture enables sound; the master timeline owns play, pause and seek.
(function() {
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';button.textContent='Sound on';button.setAttribute('aria-label','Enable sound');button.setAttribute('aria-pressed','false');controls.appendChild(button);
  let enabled=false,pending=false;
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;button.textContent='Sound on';button.setAttribute('aria-pressed','false');}).finally(()=>{pending=false;}); }
  button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(enabled));if(enabled){const tl=window.__timelines.main;if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    const tl=window.__timelines.main;
    if(enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
