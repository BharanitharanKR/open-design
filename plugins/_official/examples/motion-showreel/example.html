<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Kinetik — Showreel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="assets/gsap.min.js"></script>
<style>
  :root{
    --bg:#F4F4F1; --ink:#0E0E10; --accent:#FF3D00;
    --display:'Archivo','Arial Black',Impact,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
    --ctl:#0E0E10;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#E4E4E0;font-family:var(--mono)}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
  #viewport{position:relative;flex:none;overflow:hidden;background:var(--bg)}
  #main{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);color:var(--ink);overflow:hidden}
  #main .abs{position:absolute}
  .mono{font-family:var(--mono);font-weight:500;font-size:22px;letter-spacing:.08em;text-transform:uppercase;line-height:1.5}

  /* HUD */
  #hudL{left:96px;top:56px;width:800px;height:32px}
  #hudL span{position:absolute;left:0;top:0;white-space:nowrap;opacity:0}
  #hudR{right:96px;top:56px;text-align:right}
  #progress{left:96px;top:1008px;width:1728px;height:4px;background:rgba(14,14,16,.15)}
  #progressFill{left:96px;top:1008px;width:1728px;height:4px;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}

  /* beat 1 */
  #lines{left:144px;top:200px;display:flex;flex-direction:column}
  .mask{position:relative;overflow:hidden;height:224px;white-space:nowrap}
  .word{font-family:var(--display);font-weight:900;font-size:240px;line-height:224px;letter-spacing:-.02em;color:var(--ink);display:inline-block}
  .per{display:inline-block;width:44px;height:44px;margin-left:14px;vertical-align:baseline}

  /* guides */
  .hair{background:var(--ink);opacity:.25}
  #hh{left:96px;top:539px;width:1728px;height:2px;transform-origin:50% 50%;transform:scaleX(0)}
  #hv{left:959px;top:120px;width:2px;height:840px;transform-origin:50% 50%;transform:scaleY(0)}

  /* morph dot */
  #morph{left:0;top:0;width:44px;height:44px;border-radius:22px;background:var(--accent);border:0 solid var(--accent);opacity:0;z-index:20}
  #btnRun,#btnDone{left:0;top:0;width:240px;height:96px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:36px;letter-spacing:.12em;color:var(--ink);z-index:21;opacity:0}

  /* UI card */
  #card{left:360px;top:200px;width:1200px;height:720px;background:#FFFFFF;border:3px solid var(--ink);border-radius:24px;opacity:0;z-index:5}
  #card .abs, .uiItem{opacity:0}
  .uiLabel{font-family:var(--mono);font-weight:700;font-size:28px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
  #tTrack{left:1240px;top:300px;width:160px;height:80px;border-radius:40px;border:3px solid var(--ink);background:var(--bg);z-index:6}
  #tKnob{left:1252px;top:312px;width:56px;height:56px;border-radius:28px;background:var(--ink);z-index:7}
  #sTrack{left:780px;top:508px;width:560px;height:8px;border-radius:4px;background:rgba(14,14,16,.18);z-index:6}
  #sFill{left:780px;top:508px;width:560px;height:8px;border-radius:4px;background:var(--accent);transform-origin:0 50%;z-index:6}
  #sKnob{left:0;top:0;width:48px;height:48px;border-radius:24px;background:var(--bg);border:3px solid var(--ink);z-index:7}
  #sRead{left:1380px;top:478px;width:140px;font-family:var(--mono);font-weight:700;font-size:36px;color:var(--ink)}
  #cardTitle{left:440px;top:236px}
  #rip1,#rip2{width:80px;height:80px;border-radius:40px;border:4px solid var(--accent);left:0;top:0;opacity:0;z-index:15}
  #cursor{left:0;top:0;width:40px;height:48px;z-index:30;opacity:0}

  /* beat 4 chart */
  .bar{width:120px;background:var(--ink);transform-origin:50% 100%;transform:scaleY(0);top:0}
  #axis{left:440px;top:860px;width:1040px;height:3px;background:var(--ink);transform-origin:0 50%;transform:scaleX(0)}
  .tick{font-family:var(--mono);font-weight:500;font-size:22px;letter-spacing:.08em;width:120px;text-align:center;opacity:0}
  #lineSvg{left:0;top:0;width:1920px;height:1080px;z-index:4;overflow:visible}
  #bigNum{left:144px;top:130px;font-family:var(--display);font-weight:900;font-size:200px;line-height:1;letter-spacing:-.03em;white-space:nowrap;opacity:0}
  #bigCap{left:152px;top:350px;opacity:0}
  #bigNote{left:1500px;top:760px;width:324px;opacity:0}

  /* beat 5 */
  #frame{left:96px;top:120px;width:1728px;height:840px;border:3px solid var(--ink);clip-path:inset(0 100% 0 0);opacity:0}
  #sigWrap{left:0;top:410px;width:1920px;display:flex;justify-content:center;opacity:0}
  #sigMask{position:relative;overflow:hidden;height:200px;white-space:nowrap}
  #sigText{font-family:var(--display);font-weight:900;font-size:168px;line-height:200px;letter-spacing:-.03em;display:inline-block}
  #sigText .per{width:36px;height:36px;margin-left:10px}
  #sigSub{left:0;top:660px;width:1920px;text-align:center;opacity:0}

  /* controls */
  #controls{flex:none;display:flex;align-items:center;gap:16px;width:min(900px,92vw);color:var(--ctl);font-size:14px}
  #controls button{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.08em;background:var(--ink);color:#F4F4F1;border:0;border-radius:999px;padding:10px 20px;cursor:pointer;min-width:96px}
  #controls button:focus-visible,#controls input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  #scrub{flex:1;accent-color:#FF3D00;height:24px}
  #tc{min-width:120px;text-align:right}
</style>
</head>
<body>
<div id="viewport">
<div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">

  <!-- HUD -->
  <div id="hudL" class="abs mono">
    <span id="h1">01 — Kinetic type</span>
    <span id="h2">02 — Shape morph</span>
    <span id="h3">03 — Interface</span>
    <span id="h4">04 — Data</span>
  </div>
  <div id="hudR" class="abs mono"><span id="tcStage">00:00</span></div>
  <div id="progress" class="abs"></div>
  <div id="progressFill" class="abs"></div>

  <!-- Beat 1 -->
  <div id="lines" class="abs">
    <div class="mask"><div class="word" id="w1">MOTION</div></div>
    <div class="mask"><div class="word" id="w2">HAS</div></div>
    <div class="mask"><div class="word" id="w3">WEIGHT<span class="per" id="p1"></span></div></div>
  </div>

  <!-- guides -->
  <div id="hh" class="abs hair"></div>
  <div id="hv" class="abs hair"></div>

  <!-- Beat 3 card -->
  <div id="card" class="abs"></div>
  <div id="cardTitle" class="abs mono uiItem">Export panel · sample UI</div>
  <div id="lbl1" class="abs uiLabel uiItem" style="left:440px;top:322px">Motion blur</div>
  <div id="tTrack" class="abs uiItem"></div>
  <div id="tKnob" class="abs uiItem"></div>
  <div id="lbl2" class="abs uiLabel uiItem" style="left:440px;top:490px">Intensity</div>
  <div id="sTrack" class="abs uiItem"></div>
  <div id="sFill" class="abs uiItem"></div>
  <div id="sKnob" class="abs uiItem"></div>
  <div id="sRead" class="abs uiItem">20%</div>
  <div id="rip1" class="abs"></div>
  <div id="rip2" class="abs"></div>

  <!-- Beat 4 chart -->
  <div id="axis" class="abs"></div>
  <div id="bars"></div>
  <div id="ticks"></div>
  <svg id="lineSvg" class="abs" viewBox="0 0 1920 1080" fill="none">
    <path id="linePath" d="M560 630 L760 530 L960 570 L1160 410 L1360 270" stroke="#FF3D00" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div id="bigNum" class="abs">+0%</div>
  <div id="bigCap" class="abs mono">Placeholder growth index</div>
  <div id="bigNote" class="abs mono">Sample data — values are illustrative placeholders</div>

  <!-- Beat 5 -->
  <div id="frame" class="abs"></div>
  <div id="sigWrap" class="abs"><div id="sigMask"><div id="sigText">Studio Kinetik<span class="per" id="p2"></span></div></div></div>
  <div id="sigSub" class="abs mono">Motion design studio · Showreel</div>

  <!-- The recurring motif -->
  <div id="morph" class="abs"></div>
  <div id="btnRun" class="abs">RUN</div>
  <div id="btnDone" class="abs">DONE</div>
  <svg id="cursor" class="abs" viewBox="0 0 40 48" fill="none"><path d="M3 3 L3 38 L12 30 L18 44 L25 41 L19 28 L31 28 Z" fill="#0E0E10" stroke="#F4F4F1" stroke-width="3" stroke-linejoin="round"/></svg>
</div>
</div>

<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc" class="mono" style="font-size:14px">0.00 / 15.00</span>
</div>

<script>
/* ---- Config: single source for look and timing ---- */
const CFG = {
  duration: 15, w: 1920, h: 1080,
  bg:'#F4F4F1', ink:'#0E0E10', accent:'#FF3D00',
  bars:[160,260,220,380,520], baseY:860, barLeft:500, barW:120, barGap:80,
  center:{x:960,y:540},
  cardBtn:{x:960,y:760}
};
document.documentElement.style.setProperty('--bg',CFG.bg);
document.documentElement.style.setProperty('--ink',CFG.ink);
document.documentElement.style.setProperty('--accent',CFG.accent);

const main = document.getElementById('main');
const $ = s => document.querySelector(s);

/* ---- Build chart DOM ---- */
const barsEl = $('#bars'), ticksEl = $('#ticks');
CFG.bars.forEach((h,i)=>{
  const left = CFG.barLeft + i*(CFG.barW+CFG.barGap);
  const b = document.createElement('div');
  b.className='abs bar'; b.id='bar'+i;
  b.style.left=left+'px'; b.style.top=(CFG.baseY-h)+'px'; b.style.height=h+'px';
  if(i===CFG.bars.length-1) b.style.background=CFG.accent;
  barsEl.appendChild(b);
  const t = document.createElement('div');
  t.className='abs tick'; t.id='tick'+i;
  t.style.left=left+'px'; t.style.top=(CFG.baseY+20)+'px'; t.textContent='Q'+(i+1);
  ticksEl.appendChild(t);
});

/* ---- Helpers ---- */
function offsetCenter(el){
  let x=0,y=0,n=el;
  while(n && n!==main){ x+=n.offsetLeft; y+=n.offsetTop; n=n.offsetParent; }
  return {x:x+el.offsetWidth/2, y:y+el.offsetHeight/2};
}
const path = $('#linePath');
const pathLen = path.getTotalLength();
path.style.strokeDasharray = pathLen;
path.style.strokeDashoffset = pathLen;
const P0 = path.getPointAtLength(0);

/* ---- Timeline ---- */
const tl = gsap.timeline({ paused:true });
const clock = { t:0 };
tl.to(clock, { t:CFG.duration, duration:CFG.duration, ease:'none' }, 0);

/* initial states */
gsap.set('#morph',{xPercent:-50,yPercent:-50,x:1500,y:-80,opacity:0});
gsap.set(['#btnRun','#btnDone'],{xPercent:-50,yPercent:-50,x:CFG.cardBtn.x,y:CFG.cardBtn.y,opacity:0});
gsap.set('#cursor',{x:1750,y:980,opacity:0,transformOrigin:'3px 3px'});
gsap.set(['#rip1','#rip2'],{xPercent:-50,yPercent:-50,opacity:0});
gsap.set('#sKnob',{xPercent:-50,yPercent:-50});
gsap.set('.word',{yPercent:110,letterSpacing:'0.12em'});
gsap.set('#sigText',{yPercent:110});
gsap.set('#card',{y:40});
gsap.set('#sFill',{scaleX:0.2});
gsap.set('#sKnob',{x:780+0.2*560,y:512});

/* HUD labels */
const hud = [['#h1',0.2,3.2],['#h2',3.2,6.0],['#h3',6.0,10.0],['#h4',10.0,12.5]];
hud.forEach(([id,a,b])=>{
  tl.set(id,{opacity:1},a);
  tl.set(id,{opacity:0},b);
});
tl.set('#h1',{opacity:0},0);
tl.to(['#hudR','#progress','#progressFill'],{opacity:0,duration:0.3,ease:'power2.in'},12.6);

/* Beat 1 — kinetic type (0 – 3.0) */
['#w1','#w2','#w3'].forEach((id,i)=>{
  const t0 = 0.2 + i*0.4;
  tl.to(id,{yPercent:0,duration:0.55,ease:'power4.out'},t0);
  tl.to(id,{letterSpacing:'-0.02em',duration:0.7,ease:'expo.out'},t0);
});
// scale punch on the middle word
tl.fromTo('#w2',{scaleX:1},{scaleX:1.06,duration:0.2,ease:'power2.out',transformOrigin:'0 50%',yoyo:true,repeat:1},1.0);

// Dot drops in and becomes the full stop
tl.set('#morph',{opacity:1,x:1500,y:-80,width:44,height:44,borderRadius:22,borderWidth:0,backgroundColor:CFG.accent,rotation:0,scale:1},1.4);
tl.to('#morph',{x:()=>offsetCenter($('#p1')).x,duration:0.4,ease:'power1.out'},1.45);
tl.to('#morph',{y:()=>offsetCenter($('#p1')).y,duration:0.4,ease:'power2.in'},1.45);
tl.to('#morph',{scaleY:0.6,scaleX:1.35,duration:0.08,ease:'power1.out'},1.85);
tl.to('#morph',{scaleY:1,scaleX:1,duration:0.3,ease:'back.out(3)'},1.93);

// Exit type, dot to center
['#w1','#w2','#w3'].forEach((id,i)=>{
  tl.to(id,{yPercent:-110,duration:0.4,ease:'power3.in'},2.55+i*0.06);
});
tl.to('#morph',{x:CFG.center.x,y:CFG.center.y,duration:0.6,ease:'power3.inOut'},2.65);

/* Beat 2 — shape morph (3.2 – 6.0) */
tl.to('#hh',{scaleX:1,duration:0.7,ease:'power3.out'},3.2);
tl.to('#hv',{scaleY:1,duration:0.7,ease:'power3.out'},3.3);
tl.to('#morph',{width:560,height:44,borderRadius:22,duration:0.6,ease:'power3.inOut'},3.4);
tl.to('#morph',{width:360,height:360,borderRadius:28,rotation:90,duration:0.7,ease:'power4.inOut'},4.1);
tl.to('#morph',{backgroundColor:'rgba(255,61,0,0)',borderWidth:48,borderRadius:180,rotation:180,duration:0.8,ease:'power3.inOut'},4.9);
tl.to('#morph',{scale:1.06,duration:0.25,ease:'sine.inOut',yoyo:true,repeat:1},5.7);
tl.to(['#hh','#hv'],{opacity:0,duration:0.3,ease:'power2.in'},5.6);

/* Beat 2 → 3: ring becomes the button, card arrives */
tl.to('#morph',{y:CFG.cardBtn.y,width:240,height:96,borderRadius:48,borderWidth:0,backgroundColor:CFG.accent,rotation:360,duration:0.7,ease:'power3.inOut'},5.9);
tl.to('#card',{opacity:1,y:0,duration:0.6,ease:'power3.out'},6.0);
tl.to('.uiItem',{opacity:1,duration:0.35,ease:'power2.out',stagger:0.04},6.3);
tl.to('#btnRun',{opacity:1,duration:0.2,ease:'power2.out'},6.65);

/* Beat 3 — interface (6.0 – 10.0) */
const TOG = {x:1320,y:340};
tl.to('#cursor',{opacity:1,duration:0.15},6.7);
tl.to('#cursor',{x:TOG.x,y:TOG.y,duration:0.6,ease:'power2.inOut'},6.7);
tl.to('#cursor',{scale:0.82,duration:0.08,ease:'power1.out'},7.35);
tl.to('#cursor',{scale:1,duration:0.15,ease:'power2.out'},7.43);
tl.fromTo('#rip1',{x:TOG.x,y:TOG.y,scale:0.4,opacity:1},{scale:2.8,opacity:0,duration:0.6,ease:'power2.out'},7.38);
tl.to('#tKnob',{x:80,duration:0.25,ease:'power3.out'},7.4);
tl.to('#tTrack',{backgroundColor:CFG.accent,duration:0.25,ease:'power2.out'},7.4);

const SL = {left:780,w:560,y:512};
const ui = { p:0.2 };
const sx = p => SL.left + p*SL.w;
tl.to('#cursor',{x:sx(0.2),y:SL.y,duration:0.35,ease:'power2.inOut'},7.8);
tl.to('#cursor',{scale:0.82,duration:0.08},8.15);
tl.to('#cursor',{x:sx(0.72),duration:0.7,ease:'power2.inOut'},8.25);
tl.to(ui,{p:0.72,duration:0.7,ease:'power2.inOut',
  onUpdate(){
    gsap.set('#sKnob',{x:sx(ui.p)});
    gsap.set('#sFill',{scaleX:ui.p});
    $('#sRead').textContent = Math.round(ui.p*100)+'%';
  }},8.25);
tl.to('#cursor',{scale:1,duration:0.12},8.95);
tl.to('#cursor',{x:CFG.cardBtn.x+40,y:CFG.cardBtn.y,duration:0.4,ease:'power2.inOut'},9.0);
tl.to('#cursor',{scale:0.82,duration:0.08},9.4);
tl.to('#cursor',{scale:1,duration:0.15},9.48);
tl.fromTo('#rip2',{x:CFG.cardBtn.x,y:CFG.cardBtn.y,scale:1,opacity:1},{scale:4,opacity:0,duration:0.6,ease:'power2.out'},9.42);
tl.to('#morph',{scale:1.1,duration:0.1,ease:'power2.out',yoyo:true,repeat:1},9.42);
tl.to('#btnRun',{opacity:0,duration:0.1},9.45);
tl.to('#btnDone',{opacity:1,duration:0.15},9.5);
tl.to('#cursor',{opacity:0,duration:0.2},9.7);

// card leaves
tl.to(['#card','#cardTitle','#lbl1','#lbl2','#tTrack','#tKnob','#sTrack','#sFill','#sKnob','#sRead'],
  {opacity:0,y:'-=30',duration:0.3,ease:'power3.in',stagger:0.015},9.8);
tl.to('#btnDone',{opacity:0,duration:0.2},9.9);

/* Beat 4 — data (10.0 – 12.5) */
const lastX = path.getPointAtLength(pathLen);
tl.to('#morph',{x:P0.x,y:P0.y,width:44,height:44,borderRadius:22,duration:0.5,ease:'power3.inOut'},10.0);
tl.to('#axis',{scaleX:1,duration:0.5,ease:'power3.out'},10.1);
CFG.bars.forEach((_,i)=>{
  tl.to('#bar'+i,{scaleY:1,duration:0.55,ease:'power3.out'},10.3+i*0.08);
  tl.to('#tick'+i,{opacity:1,duration:0.25},10.5+i*0.08);
});
tl.to(['#bigNum','#bigCap'],{opacity:1,duration:0.3,ease:'power2.out'},10.4);
tl.to('#bigNote',{opacity:1,duration:0.3},11.2);
const dp = { p:0 };
tl.to(dp,{p:1,duration:0.9,ease:'power2.inOut',
  onUpdate(){
    path.style.strokeDashoffset = pathLen*(1-dp.p);
    const pt = path.getPointAtLength(pathLen*dp.p);
    gsap.set('#morph',{x:pt.x,y:pt.y});
    $('#bigNum').textContent = '+'+Math.round(dp.p*248)+'%';
  }},10.8);
tl.fromTo('#rip1',{x:lastX.x,y:lastX.y,scale:0.4,opacity:1},{scale:3,opacity:0,duration:0.5,ease:'power2.out'},11.7);
tl.to('#morph',{scale:1.5,duration:0.15,ease:'power2.out',yoyo:true,repeat:1},11.7);

// chart leaves
tl.to(['#bigNum','#bigCap','#bigNote','#axis','#lineSvg'],{opacity:0,duration:0.3,ease:'power2.in'},12.1);
CFG.bars.forEach((_,i)=>{
  tl.to('#bar'+i,{scaleY:0,duration:0.3,ease:'power3.in'},12.1+i*0.03);
  tl.to('#tick'+i,{opacity:0,duration:0.2},12.1);
});

/* Beat 5 — signature (12.4 – 13.0, then hold to 15.0) */
tl.to('#morph',{x:()=>offsetCenter($('#p2')).x,y:()=>offsetCenter($('#p2')).y,width:36,height:36,borderRadius:18,scale:1,duration:0.55,ease:'power3.inOut'},12.4);
tl.set('#sigWrap',{opacity:1},12.4);
tl.to('#sigText',{yPercent:0,duration:0.5,ease:'power4.out'},12.45);
tl.set('#frame',{opacity:1},12.4);
tl.to('#frame',{clipPath:'inset(0 0% 0 0)',duration:0.55,ease:'power3.inOut'},12.4);
tl.to('#sigSub',{opacity:1,duration:0.3,ease:'power2.out'},12.7);

/* master clock UI */
const fmt = t => {
  const s=Math.floor(t), f=Math.floor((t-s)*30);
  return String(s).padStart(2,'0')+':'+String(f).padStart(2,'0');
};
tl.eventCallback('onUpdate',()=>{
  const t = clock.t;
  $('#tcStage').textContent = fmt(t);
  gsap.set('#progressFill',{scaleX:t/CFG.duration});
});

window.__timelines = { main: tl };
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(()=>{ const t=tl.time(); tl.invalidate(); tl.time(t); }); }

/* ---- Preview shell (outside the composition) ---- */
const vp = $('#viewport'), playBtn = $('#playBtn'), scrub = $('#scrub'), tcEl = $('#tc');
function fit(){
  const ctlH = $('#controls').offsetHeight + 32;
  const s = Math.min(window.innerWidth/CFG.w, (window.innerHeight-ctlH)/CFG.h);
  vp.style.width = CFG.w*s+'px'; vp.style.height = CFG.h*s+'px';
  main.style.transform = 'scale('+s+')';
}
window.addEventListener('resize',fit); fit();

function sync(){
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2)+' / '+CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t>=CFG.duration-0.01 ? 'REPLAY' : 'PLAY');
}
tl.eventCallback('onComplete',sync);
gsap.ticker.add(sync);

playBtn.addEventListener('click',()=>{
  if(tl.time()>=CFG.duration-0.01){ tl.restart(); }
  else if(tl.paused()){ tl.play(); }
  else { tl.pause(); }
  sync();
});
scrub.addEventListener('input',()=>{ tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown',e=>{ if(e.code==='Space' && e.target===document.body){ e.preventDefault(); playBtn.click(); }});

const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce){ tl.pause(); tl.time(14); }
else { tl.play(0); }
sync();

<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame (1.5s).
(function () {
  var POSTER_AT = 1.5;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
