<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard — Pixel Spell</title>
<script src="assets/gsap.min.js"></script>
<style>
:root{--bg:#08061C;--ink:#F7ECE1;--accent:#4DD4F9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px;image-rendering:pixelated}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#0B0B0C;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="11.28" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="11.28" data-track-index="2" data-volume="1" preload="auto"></audio>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="11.28" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 11.28</span>
</div>

<script>
/* ============================================================
   Wizard — a frame-faithful rebuild of the viral pixel-art
   wizard casting a spell (@majidmanzarpour). A 128x96 logical
   canvas, a fixed palette, integer-snapped pixels, a pose that
   steps at ~10 fps, and a looping IDLE → CHARGE → CAST →
   RECOVER cycle, twice. render(t) is a pure function of time.
   ============================================================ */
const CFG = { duration: 11.28, w: 1920, h: 1080, reducedAt: 2.3, cycle: 5.64, scale: 11 };
const PAL = { '0': '#1A1544', '1': '#242051', '2': '#08061C', '3': '#2E276D', '4': '#985626', '5': '#4866FB', '6': '#4DD4F9', '7': '#B2F3FA',
  '8': '#6C1C41', '9': '#A22F45', 'a': '#EBAD4A', 'b': '#D95D45', 'c': '#A4A6C1', 'd': '#F7ECE1', 'e': '#BA6E56', 'f': '#F8B38C', 'g': '#562F28',
  'h': '#46465C', 'i': '#696485', 'j': '#2C2742', 'k': '#0F0C2B', 'm': '#F2E8D2', 'n': '#D6C9AE', 'w': '#FFFFFF', 'v': '#7A5CFF' };
const BODY = ["....................", "....................", "....................", "...2222.............", "..2888922...........", ".282288892..........", "..2..288892.........", "......288992........", "......28899b2.......", "......28899b2.......", "......288a99b2......", ".....2889999b2......", ".....28899999b2.....", "...222444aaaaa22222.", "..288888999999bbbb2.", "...2222cdeeeedc2222.", "......2cdfff2fff2...", "......2cdeedddde2...", "......2cccddddddd22.", "......2h8cddddddd22.", "......2889cdddddd2..", ".....28889cdcddd28..", ".....28889cdddddb92.", ".....288899cdcdd992.", "....2888899cddd9882.", "....24444aacdcd8882.", "....288889989cdd882.", ".....28888998cdb822.", "....2889889989cb922.", "....28898899989b922.", "....288988999899b92.", "...2888988999899b92.", "...2444444aaaaaaaa2.", "....222ggg22gggg222."]; // traced 20x34 body (staff and hand are drawn from the pose)
const LW = 128, LH = 96;
const lc = document.createElement('canvas'); lc.width = LW; lc.height = LH; const g = lc.getContext('2d');
const cv = document.getElementById('stage'); const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const io = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x < 0 || y < 0 || x >= LW || y >= LH || !PAL[c]) return; g.fillStyle = PAL[c]; g.fillRect(x, y, 1, 1); }
function line(x0, y0, x1, y1, c) { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1); const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy; for (;;) { px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } }

/* ---------- scene: sky bands with dithered seams, stars, moon, stone floor ---------- */
const SKY = (() => { const c = document.createElement('canvas'); c.width = LW; c.height = LH; const s = c.getContext('2d');
  const band = (y) => y < 16 ? ['k', 'k', 0] : y < 25 ? ['k', '0', (y - 15) / 10] : y < 40 ? ['0', '0', 0] : y < 44 ? ['0', '1', (y - 39) / 5] : y < 58 ? ['1', '1', 0] : y < 62 ? ['1', '3', (y - 57) / 5] : ['3', '3', 0];
  const bayer = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  for (let y = 0; y < 80; y++) for (let x = 0; x < LW; x++) { const [a, b, p] = band(y); s.fillStyle = PAL[(bayer[y % 4][x % 4] + 0.5) / 16 < p ? b : a]; s.fillRect(x, y, 1, 1); }
  // moon with craters
  for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) if (x * x + y * y <= 50) { s.fillStyle = PAL[(x + y > 6 && x * x + y * y > 30) ? 'n' : 'm']; s.fillRect(101 + x, 20 + y, 1, 1); }
  [[98, 17], [99, 17], [104, 22], [103, 23], [100, 24], [105, 16]].forEach(([x, y]) => { s.fillStyle = PAL.n; s.fillRect(x, y, 1, 1); });
  // floor: top course with a lit edge, mortar every 17px, offset second course
  for (let y = 80; y < LH; y++) for (let x = 0; x < LW; x++) {
    let c = 'h'; const r = rnd(x * 7.3 + y * 13.1);
    if (y === 80) c = r < 0.12 ? 'h' : 'i'; else if (y <= 85) c = (x % 17 === 12) ? '2' : r < 0.07 ? 'i' : 'h';
    else if (y === 86) c = 'j'; else if (y === 87) c = '2'; else if (y <= 93) c = (x % 17 === 4) ? '2' : r < 0.06 ? 'h' : 'j'; else if (y === 94) c = '2'; else c = 'j';
    s.fillStyle = PAL[c]; s.fillRect(x, y, 1, 1);
  }
  return c; })();
const STARS = Array.from({ length: 22 }, (_, i) => [Math.floor(rnd(i * 3.1) * LW), Math.floor(rnd(i * 5.7) * 62), rnd(i * 9.3)]).filter(([x, y]) => Math.hypot(x - 101, y - 20) > 10);

/* ---------- pose: keyframed per cycle, stepped to ~10 fps ---------- */
// [cycle time, gripX, gripY, staff angle (deg, 90 = up), below-grip length, above-grip length]
const POSE = [[0, 47, 66, 90], [0.95, 47, 66, 90], [1.2, 48, 58, 92], [1.95, 48, 58, 88], [2.12, 52, 64, 12], [2.85, 52, 64, 10], [3.3, 51, 63, 30], [3.9, 47, 66, 90], [5.64, 47, 66, 90]];
function pose(c) { let i = 0; while (i < POSE.length - 2 && POSE[i + 1][0] <= c) i++; const a = POSE[i], b = POSE[i + 1], p = io(seg(c, a[0], b[0])); return { gx: lerp(a[1], b[1], p), gy: lerp(a[2], b[2], p), ang: lerp(a[3], b[3], p) }; }

/* ---------- render ---------- */
function render(t) {
  const tq = Math.floor(t * 10) / 10, c = tq % CFG.cycle, cs = t % CFG.cycle, k = Math.floor(t / CFG.cycle);
  const charge = seg(c, 1.0, 1.95) * (c < 2.12 ? 1 : 0), cast = c >= 2.12 && c < 2.9 ? 1 - seg(c, 2.6, 2.9) : 0;
  g.drawImage(SKY, 0, 0);
  STARS.forEach(([x, y, ph], i) => { const tw = Math.floor(t * 4 + ph * 8) % 6; px(x, y, tw === 0 ? '3' : tw === 1 ? 'c' : 'w'); });
  // floor glow under the wizard while charging and casting
  const glow = Math.max(charge, cast);
  if (glow > 0) for (let x = 36; x < 36 + Math.round(20 + 40 * cast); x++) if (rnd(x + Math.floor(t * 12)) < 0.8 * glow) px(x, 80, rnd(x * 3 + Math.floor(t * 12)) < 0.5 ? '5' : '6');
  // idle bob: two frames
  const bob = (c < 0.95 || c > 3.9) && Math.floor(t * 2) % 2 ? 1 : 0;
  const P = pose(c), rad = P.ang * Math.PI / 180, ux = Math.cos(rad), uy = -Math.sin(rad);
  const below = 13, above = 19;
  const bx = P.gx - ux * below, by = P.gy - uy * below + bob, tx = P.gx + ux * above, ty = P.gy + uy * above + bob;
  // body
  BODY.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== '.') px(28 + x, 46 + y + bob, ch); }));
  // rim light from the gem on the body's right edge
  if (glow > 0.2) BODY.forEach((row, y) => { const x = row.replace(/\.+$/, '').length - 1; if (x > 0 && y > 12 && y % 2 === Math.floor(t * 12) % 2) px(28 + x, 46 + y + bob, '6'); });
  // staff with a dark outline, then the hand on top
  line(bx + 1, by, tx + 1, ty, '2'); line(bx - 1, by, tx - 1, ty, '2'); line(bx, by, tx, ty, '4');
  px(P.gx, P.gy + bob, 'f'); px(P.gx + 1, P.gy + bob, 'f'); px(P.gx, P.gy + 1 + bob, 'e'); px(P.gx + 1, P.gy + 1 + bob, 'e');
  // gem crown
  const gx = Math.round(tx), gy = Math.round(ty), fl = Math.floor(t * 12) % 2;
  px(gx - 2, gy - 1, '4'); px(gx + 2, gy - 1, '4'); px(gx - 2, gy - 2, '2'); px(gx + 2, gy - 2, '2');
  px(gx, gy - 2, '5'); px(gx - 1, gy - 1, '6'); px(gx, gy - 1, glow > 0 && fl ? 'w' : '7'); px(gx + 1, gy - 1, '6'); px(gx, gy, '5');
  // CHARGE: sparks spiral inward around the gem
  if (charge > 0) for (let i = 0; i < 26; i++) {
    const a = i / 26 * Math.PI * 2 + tq * 5 * (i % 2 ? 1 : -1), r = (12 - ((tq * 7 + i * 0.53) % 10)) * (0.6 + 0.4 * charge);
    const col = r > 8 ? 'v' : r > 5 ? '5' : r > 3 ? '6' : '7';
    px(gx + Math.cos(a) * r, gy - 1 + Math.sin(a) * r * 0.8, col);
    if (i % 3 === 0) px(gx + Math.cos(a + 0.3) * (r + 1), gy - 1 + Math.sin(a + 0.3) * (r + 1) * 0.8, 'v');
  }
  // CAST: a white-hot burst at the tip and sparks thrown forward, stepping white → magic → dark
  if (c >= 2.12 && c < 3.3) {
    const age = c - 2.12;
    if (age < 0.75) { const R = 3 + Math.floor(age * 12) % 3; for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2 + (i % 2) * 0.2, L = (i % 2 ? R : R + 3) * (1 - age * 0.3); line(gx, gy - 1, gx + Math.cos(a) * L, gy - 1 + Math.sin(a) * L * 0.8, i % 4 === 0 ? 'w' : i % 2 ? '7' : '6'); } px(gx, gy - 1, 'w'); }
    for (let i = 0; i < 26; i++) {
      const life = age - rnd(i) * 0.25; if (life < 0) continue;
      const sp = 30 + rnd(i + 7) * 60, a = (rnd(i + 3) - 0.5) * 1.3;
      const x = gx + Math.cos(a) * sp * life, y = gy - 1 + Math.sin(a) * sp * life * 0.7 + 12 * life * life;
      const st = life < 0.15 ? 'w' : life < 0.35 ? '7' : life < 0.6 ? '6' : life < 0.85 ? '5' : life < 1.0 ? 'v' : null;
      if (st) px(x, y, st);
    }
  }
  // blit at an integer scale, with a 1px screen shake on the cast
  const shake = c >= 2.12 && c < 2.4 ? (Math.floor(t * 30) % 2 ? 1 : -1) : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = PAL['2']; ctx.fillRect(0, 0, CFG.w, CFG.h);
  const S = CFG.scale, ox = Math.round((CFG.w - LW * S) / 2) + shake * S, oy = Math.round((CFG.h - LH * S) / 2);
  ctx.imageSmoothingEnabled = false; ctx.drawImage(lc, ox, oy, LW * S, LH * S);
}

/* ---------- master timeline: the only clock ---------- */
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() {
  const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h);
  main.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
// Inside an Open Design project the motion source player wraps the stage,
// fits it and adds its own controls; leave both to it there.
const hostPlayer = () => window.__odMotionSourcePlayer || main.parentElement.id !== 'viewport';
const ownFit = fit;
fit = function () { if (hostPlayer()) { main.style.transform = 'translate(-50%,-50%)'; return; } ownFit(); };
window.addEventListener('resize', fit); fit();
document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
  fit(); if (hostPlayer()) document.getElementById('controls').style.display = 'none';
}, 0));
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => {
  if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause();
  sync();
});
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(CFG.reducedAt); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    requestAnimationFrame(loop);
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 2.3;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
<script>
// Sound starts with the film. If the browser blocks unmuted autoplay, the first
// gesture on the page turns it on; the master timeline owns play, pause and seek.
(function() {
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';controls.appendChild(button);
  // Gallery thumbnails load the page in an opaque sandbox; those stay silent until asked.
  let enabled=window.origin!=='null',pending=false,chosen=false;
  const timeline=()=>window.__timelines&&window.__timelines.main;
  function label() { button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-label',enabled?'Mute sound':'Enable sound');button.setAttribute('aria-pressed',String(enabled)); }
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;label();if(!chosen)waitForGesture();}).finally(()=>{pending=false;}); }
  function waitForGesture() {
    const start=event=>{
      if(event.target===button)return;
      document.removeEventListener('pointerdown',start,true);document.removeEventListener('keydown',start,true);
      if(chosen||enabled)return;
      const tl=timeline();enabled=true;label();if(tl)audio.currentTime=tl.time();play();
    };
    document.addEventListener('pointerdown',start,true);document.addEventListener('keydown',start,true);
  }
  label();
  button.onclick=()=>{chosen=true;enabled=!enabled;label();const tl=timeline();if(enabled&&tl){if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    const tl=timeline();
    if(tl&&enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
</body>
</html>
