<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Day Is It? — Kinetic Type</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Space;src:url('assets/space-grotesk.ttf') format('truetype');font-weight:300 700;font-display:block}
:root{--bg:#EFEAE0;--ink:#121212;--accent:#2B4BFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="15" data-track-index="2" data-volume="1" preload="auto"></audio>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 15.00</span>
</div>

<script>
/* ============================================================
   What Day Is It? — 15 seconds of kinetic typography.
   A question, a slot-machine reel of weekdays, the answer, four
   beat-cut words and an odometer countdown. One canvas, one clock:
   render(t) draws every frame purely from timeline time.
   ============================================================ */
const CFG = {
  duration: 15, w: 1920, h: 1080, bpm: 120, reducedAt: 6.4,
  paper: '#EFEAE0', ink: '#121212', blue: '#2B4BFF', yellow: '#FFD23A', red: '#FF4B2B',
  days: ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'],
  answer: 4,                        // index into days: the reel lands here
  question: ['WHAT', 'DAY', 'IS IT?'],
  cuts: [ // [start, word, background, foreground]
    [7.6, 'ALMOST', '#2B4BFF', '#EFEAE0'], [8.1, 'THE', '#121212', '#FFD23A'],
    [8.6, 'WEEK—', '#FF4B2B', '#EFEAE0'], [9.1, 'END.', '#FFD23A', '#121212']
  ],
  countFrom: 8 * 3600,              // seconds on the clock when the countdown starts
  countLabel: 'UNTIL THE WEEKEND',
  signoff: 'HAVE A GOOD ONE.',
  stamp: 'WK 41 — 2026'
};
const DISPLAY = 'Space, "Arial Black", Impact, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const E = n => gsap.parseEase(n);
const EZ = { o3: E('power3.out'), i3: E('power3.in'), io3: E('power3.inOut'), o4: E('power4.out'), expo: E('expo.out'), back: E('back.out(2.2)'), io2: E('power2.inOut'), reel: E('back.out(1.4)'), i2: E('power2.in') };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;
const font = (size, w = 700, fam = DISPLAY) => `${w} ${size}px ${fam}`;

/* ---------- type helpers ---------- */
// Draw a word letter by letter. fx(i, ch) returns per-letter {dx, dy, s, a, c}.
function letters(word, x, y, size, align, color, fx, track = -0.02) {
  ctx.font = font(size);
  const ws = [...word].map(ch => ctx.measureText(ch).width + size * track);
  const total = ws.reduce((a, b) => a + b, 0) - size * track;
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  [...word].forEach((ch, i) => {
    const f = fx ? fx(i, ch) : {};
    const s = f.s ?? 1, a = f.a ?? 1;
    if (a > 0 && s > 0) {
      ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = f.c || color;
      ctx.translate(cx + ws[i] / 2 + (f.dx || 0), y + (f.dy || 0)); ctx.rotate(f.r || 0); ctx.scale(s, s);
      ctx.fillText(ch, -ws[i] / 2 + size * track / 2, 0); ctx.restore();
    }
    cx += ws[i];
  });
  return total;
}
function width(word, size) { ctx.font = font(size); return ctx.measureText(word).width + size * -0.02 * (word.length - 1); }
function mono(text, x, y, size, color, align = 'left', a = 1) {
  ctx.save(); ctx.globalAlpha = a; ctx.font = font(size, 600, MONO); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(text, x, y); ctx.restore();
}
function clipRect(x, y, w, h, draw) { ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); draw(); ctx.restore(); }

/* ---------- frame chrome ---------- */
const SCENES = [[0, 'QUESTION'], [2.5, 'SCAN'], [5.0, 'ANSWER'], [7.6, 'CUTS'], [9.6, 'COUNTDOWN'], [11.3, 'SIGN-OFF']];
function hud(t, fg) {
  const p = t / CFG.duration, k = SCENES.reduce((n, s, i) => t >= s[0] ? i : n, 0);
  mono(CFG.question.join(' '), 72, 84, 22, fg);
  mono(CFG.stamp, CFG.w - 72, 84, 22, fg, 'right');
  mono(`${String(k + 1).padStart(2, '0')} / ${String(SCENES.length).padStart(2, '0')}  ${SCENES[k][1]}`, 72, CFG.h - 60, 22, fg);
  mono(`00:${t.toFixed(2).padStart(5, '0')} / 00:15.00`, CFG.w - 72, CFG.h - 60, 22, fg, 'right');
  ctx.fillStyle = fg;
  for (let i = 0; i < 80; i++) {
    const x = 520 + i * 11, on = i / 80 < p;
    ctx.globalAlpha = on ? 1 : 0.25; ctx.fillRect(x, CFG.h - 78, 2, on ? 18 : 10);
  }
  ctx.globalAlpha = 1;
  [[48, 48, 1, 1], [CFG.w - 48, 48, -1, 1], [48, CFG.h - 32, 1, -1], [CFG.w - 48, CFG.h - 32, -1, -1]].forEach(([x, y, sx, sy]) => {
    ctx.fillRect(x, y, 28 * sx, 2 * sy); ctx.fillRect(x, y, 2 * sx, 28 * sy);
  });
}

/* ---------- reel ---------- */
const REEL = { t0: 2.6, t1: 5.0, spins: 3 };
const reelTarget = CFG.answer + 7 * REEL.spins;
const reelPos = t => reelTarget * EZ.reel(seg(t, REEL.t0, REEL.t1));
function dayList(t, fg, hi, a) {
  CFG.days.forEach((d, i) => {
    const on = seg(t, 1.5 + i * 0.07, 1.8 + i * 0.07) * a;
    if (on <= 0) return;
    const y = 372 + i * 52, sel = i === hi;
    if (sel) { ctx.globalAlpha = on; ctx.fillStyle = fg; ctx.fillRect(1590, y - 34, 250, 46); }
    mono(d, 1606 + (1 - EZ.o3(on)) * 40, y, 28, sel ? CFG.paper : fg, 'left', on);
  });
  ctx.globalAlpha = 1;
}

/* ---------- countdown odometer ---------- */
const COUNT = { t0: 9.75, t1: 11.05 };
const remaining = t => CFG.countFrom * (1 - E('power2.inOut')(seg(t, COUNT.t0, COUNT.t1)));
function odometer(t, x, y, size, color) {
  const s = remaining(t), speed = Math.abs(remaining(t + 1 / 60) - remaining(t - 1 / 60)) * 30;
  const cols = [[36000, 10], [3600, 10], null, [600, 6], [60, 10], null, [10, 6], [1, 10]];
  ctx.font = font(size); const cw = ctx.measureText('0').width * 1.02, colon = cw * 0.55;
  const total = cols.reduce((w, c) => w + (c ? cw : colon), 0);
  let cx = x - total / 2;
  clipRect(cx - 20, y - size * 0.95, total + 40, size * 1.15, () => {
    cols.forEach(c => {
      if (!c) { ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.fillText(':', cx + colon / 2, y - size * 0.06); cx += colon; return; }
      const [place, base] = c, digit = Math.floor(s / place) % base, rem = s % place;
      // odometer: a column rolls only while the column below wraps
      // columns turning faster than the eye can follow simply flicker digits
      const fast = speed / place > 6;
      const roll = fast || s <= 0.001 ? 0 : place === 1 ? 1 - (s % 1) : clamp(1 - rem / Math.min(place * 0.12, 1));
      const next = (digit + base - 1) % base;
      ctx.fillStyle = color; ctx.textAlign = 'center';
      ctx.fillText(String(digit), cx + cw / 2, y + roll * size * 0.95 * (s > 0.001 ? 1 : 0) - (place === 1 && s <= 0.001 ? 0 : 0));
      if (s > 0.001 && roll > 0) ctx.fillText(String(next), cx + cw / 2, y - (1 - roll) * size * 0.95);
      cx += cw;
    });
  });
  ctx.textAlign = 'left';
}

/* ---------- render ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = CFG.paper; ctx.fillRect(0, 0, CFG.w, CFG.h);
  let fg = CFG.ink;
  const pos = reelPos(t), hi = t >= REEL.t0 ? Math.round(pos) % 7 : -1;

  /* 1 — the question, stacked and slammed in on the beat */
  if (t < 2.5) {
    const out = EZ.i3(seg(t, 2.0, 2.4));
    CFG.question.forEach((w, i) => {
      const at = 0.25 + i * 0.5, y = 360 + i * 230, p = EZ.o4(seg(t, at, at + 0.42));
      const o = clamp(out * 1.6 - i * 0.25);
      clipRect(0, y - 210, CFG.w, 240, () => {
        letters(w, 150 - o * 1900, y + (1 - p) * 230, 236, 'left', CFG.ink, (k, ch) => {
          if (ch !== '?') return {};
          const q = seg(t, 1.5, 1.95);
          return { r: Math.sin(q * Math.PI * 3) * 0.35 * (1 - q), c: q > 0 ? CFG.blue : CFG.ink };
        });
      });
    });
    // a beat marker ticks down the margin with each word
    for (let i = 0; i < 3; i++) {
      const p = EZ.expo(seg(t, 0.25 + i * 0.5, 0.6 + i * 0.5)), y = 360 + i * 230;
      ctx.fillStyle = CFG.blue; ctx.fillRect(96 - EZ.i3(seg(t, 2.0, 2.4)) * 1900, y - 170 * p, 14, 170 * p);
    }
  }
  dayList(t, CFG.ink, hi, 1 - seg(t, 5.15, 5.3));

  /* 2 — the reel: weekdays spin past a slot window and settle */
  if (t >= 2.45 && t < 5.4) {
    const enter = EZ.o3(seg(t, 2.45, 2.75)), v = (reelPos(t + 1 / 60) - reelPos(t - 1 / 60)) * 30;
    const cx = 790, cy = 590, line = 300;
    ctx.fillStyle = CFG.ink; ctx.globalAlpha = enter;
    ctx.fillRect(140, cy - 190, 1300 * enter, 3); ctx.fillRect(140, cy + 120, 1300 * enter, 3);
    ctx.globalAlpha = 1;
    mono('SCANNING THE WEEK', 140, cy - 214, 22, CFG.ink, 'left', enter * (t < 5.0 ? (Math.floor(t * 6) % 2 ? 1 : 0.35) : 0));
    clipRect(0, cy - 187, CFG.w, 304, () => {
      for (let k = Math.floor(pos) - 1; k <= Math.floor(pos) + 2; k++) {
        const d = CFG.days[((k % 7) + 7) % 7], y = cy + (k - pos) * line + 90;
        const blur = clamp(Math.abs(v) / 18), a = enter * (1 - clamp(Math.abs(k - pos) * 0.9)) ;
        for (let g = blur > 0.05 ? 3 : 0; g >= 0; g--) {
          ctx.save(); ctx.globalAlpha = g ? a * 0.18 * blur : a;
          ctx.font = font(230); ctx.fillStyle = CFG.ink; ctx.textAlign = 'center';
          ctx.fillText(d, cx, y - g * Math.sign(v) * 26 * blur); ctx.restore();
        }
      }
    });
  }

  /* 3 — the answer: a yellow flood and a bouncing FRIDAY */
  if (t >= 5.0 && t < 7.75) {
    const flood = EZ.io3(seg(t, 5.05, 5.55));
    ctx.fillStyle = CFG.yellow; ctx.beginPath(); ctx.arc(790, 520, 2300 * flood, 0, TAU); ctx.fill();
    const grow = EZ.io3(seg(t, 5.15, 5.75)), size = lerp(230, 330, grow), x = lerp(790, 960, grow), y = lerp(680, 600, grow);
    letters(CFG.days[CFG.answer], x, y, size, 'center', CFG.ink, (i) => {
      const b = seg(t, 5.55 + i * 0.07, 5.95 + i * 0.07);
      return { dy: -Math.sin(b * Math.PI) * 60, s: 1 + Math.sin(b * Math.PI) * 0.08 };
    });
    const its = EZ.o4(seg(t, 6.0, 6.4));
    clipRect(0, 180, CFG.w, 120, () => letters("IT'S", 960, 280 + (1 - its) * 110, 96, 'center', CFG.ink));
    // the week as seven dots, today filled
    CFG.days.forEach((d, i) => {
      const p = EZ.back(seg(t, 6.0 + i * 0.05, 6.35 + i * 0.05)), xx = 960 + (i - 3) * 92, yy = 800;
      if (p <= 0) return;
      ctx.save(); ctx.translate(xx, yy); ctx.scale(p, p);
      ctx.lineWidth = 4; ctx.strokeStyle = CFG.ink; ctx.fillStyle = i === CFG.answer ? CFG.ink : 'rgba(0,0,0,0)';
      ctx.beginPath(); ctx.arc(0, 0, 28, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.font = font(26, 700, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = i === CFG.answer ? CFG.yellow : CFG.ink; ctx.fillText(d[0], 0, 2); ctx.restore();
    });
    if (flood >= 1) fg = CFG.ink;
  }

  /* 4 — four words cut on the beat, each filling the frame */
  CFG.cuts.forEach(([at, word, bg, col], i) => {
    const end = i < CFG.cuts.length - 1 ? CFG.cuts[i + 1][0] : 9.6;
    if (t < at || t >= end) return;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, CFG.w, CFG.h); fg = col;
    const size = 300, w = width(word, size), sx = Math.min(1640 / w, 2.6);
    const punch = 1 + 0.06 * Math.exp(-(t - at) * 12);
    ctx.save(); ctx.translate(960, 540); ctx.scale(sx * punch, sx * punch);
    clipRect(-w / 2 - 40, -size * 0.5, w + 80, size * 0.95, () => {
      letters(word, 0, size * 0.36, size, 'center', col, (k) => ({ dy: (1 - EZ.o4(seg(t, at + k * 0.03, at + 0.22 + k * 0.03))) * size }));
    });
    ctx.restore();
  });

  /* 5 — countdown to the weekend on an odometer */
  if (t >= 9.6 && t < 11.45) {
    const z = remaining(t) <= 0.001, hit = seg(t, COUNT.t1, COUNT.t1 + 0.12) * (1 - seg(t, 11.25, 11.45));
    if (z) { ctx.fillStyle = CFG.red; ctx.globalAlpha = hit; ctx.fillRect(0, 0, CFG.w, CFG.h); ctx.globalAlpha = 1; }
    const enter = EZ.o4(seg(t, 9.6, 9.85));
    ctx.save(); ctx.translate(0, (1 - enter) * 120); ctx.globalAlpha = enter;
    odometer(t, 960, 640, 250, z && hit > 0.5 ? CFG.paper : CFG.ink);
    mono(CFG.countLabel, 960, 360, 34, z && hit > 0.5 ? CFG.paper : CFG.ink, 'center', enter);
    ctx.restore();
    if (z && hit > 0.5) fg = CFG.paper;
  }

  /* 6 — sign-off: the answer drawn in outline, then filled */
  if (t >= 11.3) {
    const word = CFG.days[CFG.answer], size = 300, dot = 34, w = width(word, size) + 30 + dot * 2, x = 960 - w / 2, y = 610;
    const draw = seg(t, 11.35, 12.0), fill = EZ.io3(seg(t, 12.1, 12.8));
    clipRect(x - 20, 0, (w + 60) * EZ.io2(draw), CFG.h, () => {
      ctx.font = font(size); ctx.textAlign = 'left'; ctx.lineWidth = 4; ctx.strokeStyle = CFG.ink; ctx.strokeText(word, x, y);
    });
    clipRect(x - 10, 0, (w + 40) * fill, CFG.h, () => { ctx.font = font(size); ctx.textAlign = 'left'; ctx.fillStyle = CFG.ink; ctx.fillText(word, x, y); });
    // the full stop lands last, in blue
    const dotP = EZ.back(seg(t, 12.75, 13.05));
    if (dotP > 0) { ctx.fillStyle = CFG.blue; ctx.beginPath(); ctx.arc(x + w - dot, y - dot, dot * dotP, 0, TAU); ctx.fill(); }
    CFG.days.forEach((d, i) => {
      const p = EZ.back(seg(t, 12.6 + i * 0.05, 12.95 + i * 0.05)); if (p <= 0) return;
      ctx.save(); ctx.translate(960 + (i - 3) * 76, 770); ctx.scale(p, p);
      ctx.fillStyle = i === CFG.answer ? CFG.blue : 'rgba(18,18,18,.14)'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, TAU); ctx.fill();
      ctx.font = font(20, 700, MONO); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = i === CFG.answer ? CFG.paper : CFG.ink; ctx.fillText(d[0], 0, 1); ctx.restore();
    });
    const sign = EZ.o3(seg(t, 13.2, 13.7));
    mono(CFG.signoff, 960, 880 + (1 - sign) * 20, 30, CFG.ink, 'center', sign);
  }

  hud(t, fg);
}

/* ---------- master timeline: the only clock ---------- */
// Play on the wall clock even when frames are slow (software GL, a busy CI
// baker): lag smoothing would otherwise slow the timeline down and the
// preview-ready frame would never arrive.
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);
// Plugin previews may block bundled fonts; the fallback stack then renders the film.
document.fonts.load('700 100px Space').then(() => render(tl.time()), () => render(tl.time()));

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() {
  const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h);
  main.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
// Inside an Open Design project the motion source player wraps the stage,
// fits it and adds its own controls; leave both to it there.
const hostPlayer = () => window.__odMotionSourcePlayer || main.parentElement.id !== 'viewport';
const ownFit = fit;
fit = function () { if (hostPlayer()) { main.style.transform = 'translate(-50%,-50%)'; return; } ownFit(); };
window.addEventListener('resize', fit); fit();
document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
  fit(); if (hostPlayer()) document.getElementById('controls').style.display = 'none';
}, 0));
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => {
  if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause();
  sync();
});
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(CFG.reducedAt); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 6.4;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
<script>
// A user gesture enables sound; the master timeline owns play, pause and seek.
(function() {
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';button.textContent='Sound on';button.setAttribute('aria-label','Enable sound');button.setAttribute('aria-pressed','false');controls.appendChild(button);
  let enabled=false,pending=false;
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;button.textContent='Sound on';button.setAttribute('aria-pressed','false');}).finally(()=>{pending=false;}); }
  button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(enabled));if(enabled){const tl=window.__timelines.main;if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    const tl=window.__timelines.main;
    if(enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
