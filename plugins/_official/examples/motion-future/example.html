<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Future Is Already Here</title>
<style>
@font-face{font-family:UB;src:url('assets/unbounded-subset.ttf') format('truetype');font-weight:200 900;font-display:block}
@font-face{font-family:JBM;src:url('assets/jetbrains-mono-subset.ttf') format('truetype');font-weight:100 800;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#000;overflow:hidden}
#main canvas{position:absolute;left:0;top:0;display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;gap:14px;align-items:center;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover{opacity:1}#scrub{flex:1}
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport"><div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
  <canvas id="gl" width="1920" height="1080"></canvas><canvas id="ui" width="1920" height="1080"></canvas>
  <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="20" data-track-index="2" data-volume="1" preload="auto"></audio>
</div></div>
<div id="controls"><button id="playBtn" type="button" aria-label="Play or pause">PLAY</button><input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Timeline position"><span id="tc"></span></div>
<script src="assets/three.min.js"></script>
<script src="assets/gsap.min.js"></script>
<script src="assets/lat3d.js"></script>
<script src="assets/app.js"></script>
<script>
// The bundle draws with web fonts; wait for them before the first frame.
// app.js is a static script so plugin previews and the frozen package both resolve it.
Promise.all([document.fonts.load('900 100px UB'), document.fonts.load('600 20px JBM')]).finally(boot);
function boot() {
  const D = window.__DURATION; document.getElementById('main').dataset.duration = D; document.getElementById('scrub').max = D;
  gsap.ticker.lagSmoothing(0);
  const tl = gsap.timeline({ paused: true }); const clock = { t: 0 };
  tl.to(clock, { t: D, duration: D, ease: 'none' }, 0);
  tl.eventCallback('onUpdate', () => window.__render(tl.time()));
  window.__timelines = { main: tl }; window.__render(0);
  const main = document.getElementById('main');
  const fit = () => { if (window.__odMotionSourcePlayer || main.parentElement.id !== 'viewport') { main.style.transform = 'translate(-50%,-50%)'; return; } const k = Math.min(innerWidth / 1920, innerHeight / 1080); main.style.transform = 'translate(-50%,-50%) scale(' + k + ')'; };
  addEventListener('resize', fit); fit();
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), btn = document.getElementById('playBtn');
  gsap.ticker.add(() => { scrub.value = tl.time(); tc.textContent = tl.time().toFixed(2) + ' / ' + D.toFixed(2); });
  btn.onclick = () => tl.paused() ? tl.play() : tl.pause(); scrub.oninput = () => { tl.pause(); tl.time(+scrub.value); };
  var drawnAt = null; (function loop() { requestAnimationFrame(loop); if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) document.documentElement.classList.add('od-export'); const t = tl.time(); if (t !== drawnAt) { drawnAt = t; window.__render(t); } })();
  tl.eventCallback('onUpdate', () => { drawnAt = tl.time(); window.__render(drawnAt); });
  if (!window.__odFrameRenderer) tl.play(0);
  (function check() { if (tl.time() >= Math.min(6.2, D - 0.5) || window.__odFrameRenderer) { document.documentElement.setAttribute('data-od-preview-ready', 'true'); return; } requestAnimationFrame(check); })();
}
</script>
<script>
// A user gesture enables sound; the master timeline owns play, pause and seek.
(function() {
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';button.textContent='Sound on';button.setAttribute('aria-label','Enable sound');button.setAttribute('aria-pressed','false');controls.appendChild(button);
  let enabled=false,pending=false;
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;button.textContent='Sound on';button.setAttribute('aria-pressed','false');}).finally(()=>{pending=false;}); }
  button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(enabled));if(enabled){const tl=window.__timelines.main;if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    const tl=window.__timelines&&window.__timelines.main;
    if(!tl){requestAnimationFrame(sync);return;}
    if(enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
</body>
</html>
