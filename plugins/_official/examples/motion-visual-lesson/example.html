<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta name="od-motion-output" content="video">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Do You Love? — Paper Short</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Stack;src:url('assets/short-stack-regular.ttf') format('truetype');font-display:block}
:root{--bg:#252C6E;--ink:#FBF6EC;--accent:#7CE15A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#0B0B0C;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
/* The OD export bridge marks frame capture; keep preview controls out of the film. */
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
    <audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="20" data-track-index="2" data-volume="1" preload="auto"></audio>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 20.00</span>
</div>

<script>
/* ============================================================
   What Do You Love? — a 20-second paper-collage short.
   Everyone in town sends the Open Design buddy a request; one girl
   sends a question instead. One canvas, one clock: render(t) draws
   every frame purely from timeline time. Every texture (dry brush,
   crayon grain, newsprint, handwriting, knit) and every cut-paper
   illustration is painted once into an offscreen canvas at load;
   frames only composite them.
   ============================================================ */
const CFG = {
  duration: 20, w: 1920, h: 1080, bpm: 120, reducedAt: 7.8,
  night: '#262D70', night2: '#30398A', night3: '#1E2462', star: '#26251E', tile: '#26251E', accent: '#7CE15A',
  girlSweater: '#2E9C82', skin: '#EDB98F', hair: '#3A2723', clip: '#F2C53D', cheek: '#F09AA0',
  ink: '#2B2550', pen: '#3B62B5', red: '#D8443A', paper: '#FFFCF3', wall: '#4A3A8A', yellow: '#F4C443', curtain: '#EE8E96', wood: '#C8914F',
  question: 'what do you love?'
};
const W = CFG.w, H = CFG.h, TAU = Math.PI * 2;
const HAND = 'Stack, "Comic Sans MS", "Chalkboard SE", sans-serif';
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const EZ = { o2: p => 1 - (1 - p) ** 2, o3: p => 1 - (1 - p) ** 3, i2: p => p * p, io2: p => p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2,
  back: p => { const c = 1.9, c3 = c + 1; return 1 + c3 * (p - 1) ** 3 + c * (p - 1) ** 2; } };
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const hop = (t, a, d = 0.35) => Math.sin(Math.PI * seg(t, a, a + d));

/* ---------- textures, painted once ---------- */
function layer(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d')); return c; }
// Wrap a stroke so the tile repeats without seams.
function tileStroke(g, size, draw) { for (const dx of [-size, 0, size]) for (const dy of [-size, 0, size]) { g.save(); g.translate(dx, dy); draw(); g.restore(); } }
const TEX = {
  // Dry gouache: short wobbly strokes, lighter and darker than the paint underneath.
  brush: (() => {
    const soft = layer(512, 512, g => { g.lineCap = 'round';
      for (let i = 0; i < 300; i++) { const x = rnd(i * 1.3) * 512, y = rnd(i * 2.9) * 512, l = 60 + rnd(i * 4.1) * 180, w = 6 + rnd(i * 5.3) * 18, a = (rnd(i * 6.7) - 0.5) * 0.06, light = i % 3 !== 0;
        g.strokeStyle = light ? `rgba(255,255,255,${0.035 + rnd(i * 7.1) * 0.06})` : `rgba(0,0,0,${0.025 + rnd(i * 8.3) * 0.035})`; g.lineWidth = w;
        tileStroke(g, 512, () => { g.beginPath(); g.moveTo(x, y); g.lineTo(x + l * Math.cos(a), y + l * Math.sin(a)); g.stroke(); }); } });
    // Blur the wide strokes once (over a 3x3 tiling so the edges still wrap), then add crisp bristle lines.
    return layer(512, 512, g => { g.filter = 'blur(3px)'; for (const dx of [-512, 0, 512]) for (const dy of [-512, 0, 512]) g.drawImage(soft, dx, dy); g.filter = 'none'; g.lineCap = 'round';
      for (let i = 0; i < 260; i++) { const x = rnd(i * 9.3) * 512, y = rnd(i * 3.7) * 512, l = 40 + rnd(i * 2.1) * 140, light = i % 2;
        g.strokeStyle = light ? `rgba(255,255,255,${0.04 + rnd(i) * 0.05})` : `rgba(0,0,0,${0.025 + rnd(i * 3) * 0.03})`; g.lineWidth = 1 + rnd(i * 4) * 1.4;
        tileStroke(g, 512, () => { g.beginPath(); g.moveTo(x, y); g.lineTo(x + l, y + (rnd(i * 5) - 0.5) * 4); g.stroke(); }); } });
  })(),
  // Large grounds: short faint strokes at mixed angles, so a wall or sky reads almost flat from afar.
  soft: (() => {
    const raw = layer(512, 512, g => { g.lineCap = 'round';
      for (let i = 0; i < 900; i++) { const x = rnd(i * 1.7) * 512, y = rnd(i * 3.3) * 512, l = 12 + rnd(i * 4.9) * 40, w = 4 + rnd(i * 5.9) * 9, a = (rnd(i * 7.7) - 0.5) * (i % 4 ? 1.2 : 3.2), light = i % 2;
        g.strokeStyle = light ? `rgba(255,255,255,${0.015 + rnd(i * 2.3) * 0.025})` : `rgba(0,0,0,${0.012 + rnd(i * 3.9) * 0.018})`; g.lineWidth = w;
        tileStroke(g, 512, () => { g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l * 0.5 * Math.cos(a) - 3, y + l * 0.5 * Math.sin(a) + 3, x + l * Math.cos(a), y + l * Math.sin(a)); g.stroke(); }); } });
    return layer(512, 512, g => { g.filter = 'blur(1.5px)'; for (const dx of [-512, 0, 512]) for (const dy of [-512, 0, 512]) g.drawImage(raw, dx, dy); });
  })(),
  // Paper tooth: fine specks and short fibres.
  fiber: layer(256, 256, g => { for (let i = 0; i < 900; i++) { const x = rnd(i * 5.1) * 256, y = rnd(i * 8.7) * 256; g.fillStyle = i % 3 ? `rgba(255,255,255,${0.05 + rnd(i * 1.9) * 0.06})` : `rgba(0,0,0,${0.035 + rnd(i * 2.7) * 0.04})`; g.fillRect(x, y, 1, 1); }
    g.lineWidth = 0.8; for (let i = 0; i < 70; i++) { const x = rnd(i * 6.3) * 256, y = rnd(i * 4.4) * 256, a = rnd(i * 9.9) * TAU, l = 3 + rnd(i) * 7; g.strokeStyle = `rgba(0,0,0,${0.04 + rnd(i * 3) * 0.04})`; tileStroke(g, 256, () => { g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }); } }),
  // Crayon tooth: sparse specks.
  grain: layer(256, 256, g => { for (let i = 0; i < 700; i++) { const x = rnd(i * 3.7) * 256, y = rnd(i * 9.1) * 256, r = 0.6 + rnd(i) * 1.4; g.fillStyle = i % 2 ? `rgba(255,255,255,${0.08 + rnd(i * 2) * 0.1})` : `rgba(0,0,0,${0.04 + rnd(i * 5) * 0.06})`; g.fillRect(x, y, r, r); } }),
  // Old newsprint: headline bars, columns of grey word dashes.
  news: layer(360, 360, g => { g.fillStyle = 'rgba(40,36,30,.5)';
    for (let col = 0; col < 3; col++) { const x0 = 8 + col * 120; let y = 10;
      while (y < 350) { if (rnd(col * 31 + y) > 0.86) { g.fillRect(x0, y, 100, 9); y += 18; continue; }
        let x = x0; while (x < x0 + 104) { const w = 4 + rnd(x * 1.7 + y * 3.1) * 14; g.fillRect(x, y, Math.min(w, x0 + 106 - x), 2.6); x += w + 3; } y += 7; } } }),
  // Hand lettering texture: rows of loopy script.
  scrib: layer(420, 300, g => { g.strokeStyle = 'rgba(60,40,25,.42)'; g.lineWidth = 1.6; g.lineCap = 'round';
    for (let y = 14; y < 300; y += 20) { let x = 6; while (x < 410) { const w = 18 + rnd(x * 0.9 + y * 2.3) * 46; g.beginPath(); for (let k = 0; k <= w; k += 2) g.lineTo(x + k, y + Math.sin(k * 0.9 + x) * 3.2 - Math.abs(Math.sin(k * 0.45 + y)) * 3); g.stroke(); x += w + 9; } } }),
  knit: layer(28, 28, g => { g.fillStyle = CFG.girlSweater; g.fillRect(0, 0, 28, 28); g.strokeStyle = 'rgba(0,0,0,.16)'; g.lineWidth = 2;
    for (const ox of [0, 14]) { g.beginPath(); g.moveTo(ox + 2, 4); g.lineTo(ox + 7, 12); g.lineTo(ox + 12, 4); g.stroke(); g.beginPath(); g.moveTo(ox + 2 - 7, 18); g.lineTo(ox, 26); g.lineTo(ox + 5, 18); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,.08)'; g.fillRect(0, 0, 28, 3); }),
  hair: layer(120, 120, g => { g.fillStyle = CFG.hair; g.fillRect(0, 0, 120, 120); g.strokeStyle = 'rgba(255,255,255,.07)'; g.lineWidth = 3; for (let i = 0; i < 26; i++) { const x = rnd(i * 2.2) * 120; tileStroke(g, 120, () => { g.beginPath(); g.moveTo(x, 0); g.quadraticCurveTo(x + 10, 60, x - 4, 120); g.stroke(); }); } }),
};
const PATS = new Map();
function pat(g, name) { let m = PATS.get(g); if (!m) PATS.set(g, m = {}); return m[name] || (m[name] = g.createPattern(TEX[name], 'repeat')); }
// Wash a texture over whatever the current clip allows.
function wash(g, name, alpha, box) { g.save(); g.globalAlpha = alpha; g.fillStyle = pat(g, name); g.fillRect(box[0], box[1], box[2], box[3]); g.restore(); }

/* ---------- cut paper ---------- */
function poly(g, pts) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function jag(g, pts, close = true) { g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); if (close) g.closePath(); }
function resample(pts, step = 7) { const out = []; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step)); for (let k = 0; k < n; k++) out.push([a[0] + (b[0] - a[0]) * k / n, a[1] + (b[1] - a[1]) * k / n]); } return out; }
// Push each outline point outward by a ragged amount: the white fibre rim of torn paper.
function ragged(pts, amp, seed) {
  const n = pts.length, cx = pts.reduce((s, p) => s + p[0], 0) / n, cy = pts.reduce((s, p) => s + p[1], 0) / n;
  return pts.map((p, i) => { const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n]; let nx = b[1] - a[1], ny = a[0] - b[0]; const l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    if ((p[0] - cx) * nx + (p[1] - cy) * ny < 0) { nx = -nx; ny = -ny; } const r = amp * (0.25 + rnd(seed + i * 1.37) * 1.1 + (rnd(seed + Math.floor(i / 5)) > 0.8 ? 0.8 : 0)); return [p[0] + nx * r, p[1] + ny * r]; });
}
function bbox(pts) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; pts.forEach(([x, y]) => { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); }); return [a - 4, b - 4, c - a + 8, d - b + 8]; }
// A cut-paper shape: ragged white rim, flat paint, dry brush, grain, optional print.
function cut(g, pts, color, o = {}) {
  const P = resample(pts, o.step || 7), seed = o.seed || 1, box = bbox(P);
  if (o.rim !== 0) { g.fillStyle = o.rimColor || CFG.paper; poly(g, ragged(P, o.rim || 3.2, seed)); g.fill(); }
  g.save(); poly(g, P); g.fillStyle = color; g.fill(); g.clip();
  if (o.ground) { wash(g, 'soft', o.brush ?? 1, box); wash(g, 'fiber', 1, box); } else { wash(g, 'brush', o.brush ?? 0.9, box); wash(g, 'grain', o.grainA ?? 0.6, box); }
  if (o.print) wash(g, o.print, o.printA ?? 0.55, box);
  if (o.shade !== false) { g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 8; poly(g, P); g.stroke(); }
  g.restore();
}
const ell = (cx, cy, rx, ry, seed = 1, jit = 0.025, n = 56) => Array.from({ length: n }, (_, i) => { const a = i / n * TAU, r = 1 + (rnd(seed + i) - 0.5) * jit * 2; return [cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r]; });
const box4 = (x, y, w, h, seed = 1, j = 2) => [[x + (rnd(seed) - .5) * j, y + (rnd(seed + 1) - .5) * j], [x + w + (rnd(seed + 2) - .5) * j, y + (rnd(seed + 3) - .5) * j], [x + w + (rnd(seed + 4) - .5) * j, y + h + (rnd(seed + 5) - .5) * j], [x + (rnd(seed + 6) - .5) * j, y + h + (rnd(seed + 7) - .5) * j]];
function arcPts(cx, cy, r, a0, a1, n = 30) { return Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; }); }
// A painted ground (half resolution, scaled up when drawn): faint mixed strokes and paper tooth, nearly flat from afar.
function sheet(color, seed, o = {}) { return layer(W / 2, H / 2, g => { g.fillStyle = color; g.fillRect(0, 0, W / 2, H / 2); g.save(); g.scale(0.5, 0.5); wash(g, 'soft', o.brush ?? 0.8, [0, 0, W, H]); g.translate(257, 171); wash(g, 'soft', 0.5, [-257, -171, W, H]); g.restore(); wash(g, 'fiber', 1, [0, 0, W / 2, H / 2]); if (o.print) { g.save(); g.scale(0.5, 0.5); wash(g, o.print, o.printA ?? 0.4, [0, 0, W, H]); g.restore(); } }); }

/* ---------- lettering ---------- */
function hand(s, x, y, size, color, o = {}) {
  const g = o.g || ctx; g.save(); g.font = `${size}px ${HAND}`; g.textAlign = o.align || 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = color; g.globalAlpha = o.a ?? 1;
  g.translate(x, y); if (o.rot) g.rotate(o.rot); g.lineJoin = 'round';
  if (o.rim) { g.strokeStyle = CFG.paper; g.lineWidth = size * 0.16; g.strokeText(s, 0, 0); }
  g.lineWidth = size * 0.035; g.strokeStyle = color; g.strokeText(s, 0, 0); g.fillText(s, 0, 0); g.restore();
}
function writeText(s, x, y, size, color, p, g = ctx) {
  g.save(); g.font = `${size}px ${HAND}`; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  const total = g.measureText(s).width, cut2 = total * clamp(p);
  g.beginPath(); g.rect(x - 10, y - size * 1.2, cut2 + 10, size * 1.6); g.clip();
  g.fillStyle = color; g.strokeStyle = color; g.lineWidth = size * 0.035; g.lineJoin = 'round'; g.strokeText(s, x, y); g.fillText(s, x, y); g.restore();

}
function sparkle(x, y, r, col, rot = 0, g = ctx) { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU, rr = i % 2 ? r * 0.28 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); g.restore(); }
function star5(g, x, y, r, col, rot = 0) { g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.beginPath(); for (let k = 0; k < 10; k++) { const a = k / 10 * TAU - Math.PI / 2, rr = k % 2 ? r * 0.45 : r; g.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } g.closePath(); g.fill(); g.restore(); }
function plus(x, y, r, col, g = ctx) { g.strokeStyle = col; g.lineWidth = r * 0.35; g.lineCap = 'round'; g.beginPath(); g.moveTo(x - r, y); g.lineTo(x + r, y); g.moveTo(x, y - r); g.lineTo(x, y + r); g.stroke(); }

// Sprites that carry lettering wait for the hand font; until then they are drawn fresh each frame.
const fontReady = () => document.fonts.check('10px Stack');
function textSprite(w, h, draw) { let c = null; return () => c || (fontReady() ? (c = layer(w, h, draw)) : layer(w, h, draw)); }
const rrPts = (x, y, w, h, r, n = 8) => { const p = []; [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]].forEach(([cx, cy, a0]) => { for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; p.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } }); return p; };
// A limb: paper rim, then paint, then a round paw.
function limb(g, pts, w, color, pawR, pawColor, o = {}) {
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.strokeStyle = CFG.paper; g.lineWidth = w + 7; g.stroke(); g.strokeStyle = o.pat ? pat(g, o.pat) : color; g.lineWidth = w; g.stroke();
  if (o.pat) { g.strokeStyle = 'rgba(0,0,0,.1)'; g.lineWidth = w * 0.25; g.stroke(); }
  const [hx, hy] = pts[pts.length - 1]; if (pawR) { g.fillStyle = CFG.paper; g.beginPath(); g.arc(hx, hy, pawR + 3.5, 0, TAU); g.fill(); g.fillStyle = pawColor; g.beginPath(); g.arc(hx, hy, pawR, 0, TAU); g.fill(); }
  g.restore();
}

/* ---------- the Open Design buddy (from the logo mark) ---------- */
// Body painted once at R = 320: a dark cut-paper tile with the logo's white ring and green cursor badge.
const BUD_R = 320, BUD_S = BUD_R * 0.92, BUD_r = BUD_S * 0.62;
const ringPts = (r) => { const p = arcPts(0, 0, r, -Math.PI / 2, Math.PI / 2, 24); p.push([-r * 0.88, r]); p.push(...arcPts(-r * 0.88, r * 0.88, r * 0.12, Math.PI / 2, Math.PI, 4)); p.push(...arcPts(0, 0, r, Math.PI, Math.PI * 1.5, 16)); return p; };
const BUD = layer(700, 700, g => { g.translate(350, 350); const S = BUD_S, r = BUD_r;
  cut(g, rrPts(-S, -S, S * 2, S * 2, S * 0.62, 10), CFG.tile, { rim: 6, seed: 7, brush: 0.55, grainA: 0.5, shade: false });
  cut(g, ringPts(r), '#F7F2E6', { rim: 0, seed: 8, brush: 0.6, grainA: 0.5 });
  cut(g, ell(0, 0, r * 0.8, r * 0.8, 9, 0.01), CFG.tile, { rim: 0, seed: 9, brush: 0.55, grainA: 0.5, shade: false });
  g.save(); g.translate(S * 0.62, S * 0.6); g.scale(2.6, 2.6); cut(g, [[-14, -16], [18, -3], [3, 2], [-3, 18]], CFG.accent, { rim: 1.6, step: 3, seed: 10, brush: 0.6 }); g.restore();
  g.fillStyle = CFG.cheek; g.globalAlpha = 0.8; [-1, 1].forEach(s => { g.beginPath(); g.ellipse(s * r * 0.47, r * 0.16, r * 0.11, r * 0.07, 0, 0, TAU); g.fill(); }); });
// expr: smile | o | closed | content | wow | squint
function buddy(cx, cy, R, t, expr = 'smile', o = {}) {
  const g = o.g || ctx; g.save(); g.translate(cx, cy); g.rotate((o.rot || 0) + Math.sin(t * 3 + (o.ph || 0)) * 0.03 * (o.wiggle ?? 1));
  const k = R / BUD_R; g.scale(k * (o.sx || 1), k * (o.sy || 1)); g.drawImage(BUD, -350, -350);
  const r = BUD_r, ex = r * 0.3, ey = -r * 0.12, er = r * 0.075, fc = '#FFFCF3', lx = (o.look || 0) * r * 0.06;
  g.strokeStyle = fc; g.fillStyle = fc; g.lineWidth = r * 0.06; g.lineCap = 'round';

  button.onclick=()=>{chosen=true;enabled=!enabled;label();const tl=timeline();if(enabled&&tl){if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    if (window.__odMotionSourcePlayer) return;
    const tl=timeline();
    if(tl&&enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
</body>
