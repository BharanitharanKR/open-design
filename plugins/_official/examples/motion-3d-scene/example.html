<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Worlds — Island at golden hour</title>
<script src="assets/three.min.js"></script>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Space;src:url('assets/space-grotesk.ttf') format('truetype');font-weight:300 700;font-display:block}
:root{--bg:#20183A;--accent:#FFB45E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{position:absolute;left:0;top:0;display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#20183A;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <canvas id="gl" width="1920" height="1080"></canvas>
    <canvas id="ui" width="1920" height="1080"></canvas>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 15.00</span>
</div>

<script>
/* ============================================================
   Tiny Worlds 01 — a procedural island at golden hour.
   Everything (terrain, waves, foam, palms, boat, birds, camera)
   is computed from timeline time t inside render(t), so every
   frame is reproducible for scrubbing and MP4 export.
   ============================================================ */
const CFG = {
  duration: 15, w: 1920, h: 1080,
  deep: '#1A7590', shallow: '#52DCC8', foam: '#F4FFF8', sand: '#F1D49B', grass: '#6CBF5B', grassDark: '#3F8F47',
  skyTop: '#2A2458', skyHorizon: '#FF9A5C', sunColor: '#FFE3A3',
  kicker: 'TINY WORLDS  ·  01 — GOLDEN HOUR', open: 'A little escape.', close: 'Stay a little longer.'
};
const DISPLAY = 'Space, "Avenir Next", "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
const E = n => gsap.parseEase(n);
const EZ = { o3: E('power3.out'), io2: E('power2.inOut'), io3: E('power3.inOut'), o2: E('power2.out') };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;
const col = c => new THREE.Color(c);

/* ---------- renderer & scene ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(CFG.w, CFG.h, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(col('#E98A6A'), 140, 360);
const camera = new THREE.PerspectiveCamera(38, CFG.w / CFG.h, 0.5, 900);
const SUN_DIR = new THREE.Vector3(-0.75, 0.2, -0.62).normalize();

// sky dome with sun glow
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: col(CFG.skyTop) }, horizon: { value: col(CFG.skyHorizon) }, sunCol: { value: col(CFG.sunColor) }, sunDir: { value: SUN_DIR } },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `uniform vec3 top; uniform vec3 horizon; uniform vec3 sunCol; uniform vec3 sunDir; varying vec3 vDir;
    void main(){ float h = clamp(vDir.y, 0.0, 1.0);
      vec3 c = mix(horizon, top, pow(h, 0.55));
      c = mix(c, vec3(1.0,0.78,0.62), smoothstep(0.12, 0.0, h) * 0.55);
      float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
      c += sunCol * (pow(s, 900.0) * 3.0 + pow(s, 12.0) * 0.45);
      gl_FragColor = vec4(c, 1.0); }`
}));
scene.add(sky);
scene.add(new THREE.HemisphereLight(col('#FFD7B0'), col('#3B4A7A'), 0.9));
const sun = new THREE.DirectionalLight(col('#FFC58A'), 2.4);
sun.position.copy(SUN_DIR).multiplyScalar(100); scene.add(sun);
const fill = new THREE.DirectionalLight(col('#8FA8FF'), 0.45); fill.position.set(40, 30, 60); scene.add(fill);

/* ---------- terrain ---------- */
function islandHeight(x, z) {
  const r = Math.hypot(x, z), a = Math.atan2(z, x);
  const rr = r * (1 + 0.1 * Math.sin(3 * a + 0.4) + 0.06 * Math.sin(5 * a + 2.1));
  return 9.5 * Math.exp(-Math.pow(rr / 13.5, 2)) - 3.2 + 0.45 * Math.sin(x * 0.55) * Math.cos(z * 0.6) * Math.exp(-rr / 20);
}
{
  const g = new THREE.PlaneGeometry(70, 70, 110, 110).toNonIndexed(); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, colors = [];
  for (let i = 0; i < p.count; i++) p.setY(i, islandHeight(p.getX(i), p.getZ(i)));
  const c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) { // colour per facet by average height
    const h = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3;
    c.set(h < -0.4 ? '#C8AE76' : h < 1.3 ? CFG.sand : h < 3.6 ? CFG.grass : CFG.grassDark);
    if (h >= 1.3 && h < 1.7) c.lerp(col(CFG.sand), 0.5);
    for (let k = 0; k < 3; k++) colors.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95 })));
}

/* ---------- ocean: waves + animated shoreline foam ---------- */
const ocean = (() => {
  const g = new THREE.PlaneGeometry(520, 520, 150, 150); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position, n = p.count;
  const base = new Float32Array(n * 3), depth = new Float32Array(n), colors = new Float32Array(n * 3);
  const deep = col(CFG.deep), shallow = col(CFG.shallow);
  for (let i = 0; i < n; i++) {
    base[i * 3] = p.getX(i); base[i * 3 + 2] = p.getZ(i);
    const h = islandHeight(p.getX(i), p.getZ(i));
    depth[i] = h; // > -3.2 near the island
    const k = clamp((h + 3.2) / 3.0);
    const c = deep.clone().lerp(shallow, Math.pow(k, 0.7));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  g.setAttribute('color', new THREE.BufferAttribute(colors.slice(), 3));
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.42, metalness: 0.0, transparent: true, opacity: 0.94 });
  const mesh = new THREE.Mesh(g, mat); scene.add(mesh);
  const foamCol = col(CFG.foam);
  return {
    update(t) {
      const cAttr = g.attributes.color;
      for (let i = 0; i < n; i++) {
        const x = base[i * 3], z = base[i * 3 + 2];
        const y = 0.32 * Math.sin(x * 0.18 + t * 1.3) + 0.24 * Math.sin(z * 0.23 - t * 1.1) + 0.12 * Math.sin((x + z) * 0.5 + t * 2.1);
        p.setY(i, y);
        const h = depth[i];
        if (h > -1.6 && h < 0.4) { // foam band that breathes with the waves
          const band = 1 - Math.abs(h + 0.55) / 1.05;
          const pulse = 0.55 + 0.45 * Math.sin(t * 2.2 - Math.hypot(x, z) * 0.9);
          const f = clamp(band * pulse * 1.3);
          cAttr.setXYZ(i, lerp(colors[i * 3], foamCol.r, f), lerp(colors[i * 3 + 1], foamCol.g, f), lerp(colors[i * 3 + 2], foamCol.b, f));
        }
      }
      p.needsUpdate = true; cAttr.needsUpdate = true; g.computeVertexNormals();
    }
  };
})();

/* ---------- palms ---------- */
const leafMat = new THREE.MeshStandardMaterial({ color: col('#3E9B52'), flatShading: true, side: THREE.DoubleSide, roughness: 0.8 });
const trunkMat = new THREE.MeshStandardMaterial({ color: col('#8A5A3B'), flatShading: true, roughness: 1 });
function leafGeometry() {
  const g = new THREE.PlaneGeometry(4.6, 1.1, 8, 1); g.translate(2.3, 0, 0);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const x = p.getX(i), k = x / 4.6; p.setY(i, p.getY(i) * (1 - k * 0.85)); p.setZ(i, -0.16 * x * x); }
  g.rotateX(-Math.PI / 2); g.computeVertexNormals(); return g;
}
const LEAF = leafGeometry();
const palms = [[-2.5, 1.5, 7.5, 0.3], [2.6, -2.8, 8.4, -0.4], [4.4, 2.6, 6.8, 0.9], [-5.6, -3.6, 6.4, 2.2], [0.4, 4.8, 6.0, 1.4]].map(([x, z, height, lean], i) => {
  const y0 = islandHeight(x, z) - 0.2;
  const dir = new THREE.Vector3(Math.cos(lean), 0, Math.sin(lean));
  const curve = new THREE.CatmullRomCurve3([0, 0.33, 0.66, 1].map(k => new THREE.Vector3(x + dir.x * k * k * 2.2, y0 + k * height, z + dir.z * k * k * 2.2)));
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 10, 0.34, 6), trunkMat));
  const crown = new THREE.Group(); crown.position.copy(curve.getPoint(1)); scene.add(crown);
  for (let k = 0; k < 8; k++) {
    const leaf = new THREE.Mesh(LEAF, leafMat); leaf.rotation.y = k / 8 * TAU + i; leaf.rotation.z = 0.25 + (k % 2) * 0.2; crown.add(leaf);
  }
  const coco = new THREE.Mesh(new THREE.IcosahedronGeometry(0.32, 0), new THREE.MeshStandardMaterial({ color: col('#5B3A22'), flatShading: true }));
  coco.position.set(0.3, -0.35, 0.2); crown.add(coco);
  return { crown, phase: i * 1.7 };
});

/* ---------- hut + dock ---------- */
const hutAng = 0.75, hutR = 8.6;
const hutPos = new THREE.Vector3(Math.cos(hutAng) * hutR, 0, Math.sin(hutAng) * hutR); hutPos.y = islandHeight(hutPos.x, hutPos.z);
{
  const hut = new THREE.Group(); hut.position.copy(hutPos); hut.rotation.y = -hutAng + Math.PI / 2;
  const wall = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.2, 2.8), new THREE.MeshStandardMaterial({ color: col('#F6E7CF'), flatShading: true }));
  wall.position.y = 1.1; hut.add(wall);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.9, 1.9, 4), new THREE.MeshStandardMaterial({ color: col('#E2674C'), flatShading: true }));
  roof.position.y = 3.1; roof.rotation.y = Math.PI / 4; hut.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.3, 0.1), new THREE.MeshStandardMaterial({ color: col('#4A2E2A') }));
  door.position.set(0, 0.65, 1.42); hut.add(door);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.22, 8, 6), new THREE.MeshBasicMaterial({ color: col('#FFE6A0') }));
  lamp.position.set(1.0, 1.7, 1.5); hut.add(lamp);
  scene.add(hut);
  const plank = new THREE.MeshStandardMaterial({ color: col('#B9875A'), flatShading: true });
  const dock = new THREE.Group(); dock.rotation.y = -hutAng; scene.add(dock);
  for (let k = 0; k < 9; k++) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(0.75, 0.18, 2.4), plank); b.position.set(10.5 + k * 0.9, 0.85, 0); dock.add(b);
    if (k % 3 === 0) [-1, 1].forEach(s => { const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.4, 5), plank); post.position.set(10.5 + k * 0.9, -0.2, s * 1.1); dock.add(post); });
  }
}

/* ---------- sailboat ---------- */
const boat = (() => {
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.5, 4.2, 6, 1), new THREE.MeshStandardMaterial({ color: col('#F4EEE4'), flatShading: true }));
  hull.rotation.z = Math.PI / 2; hull.scale.set(1, 1, 0.55); g.add(hull);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 5, 5), trunkMat); mast.position.y = 2.6; g.add(mast);
  const sailG = new THREE.BufferGeometry(); sailG.setAttribute('position', new THREE.Float32BufferAttribute([0.1, 0.6, 0, 0.1, 4.9, 0, 2.4, 0.7, 0], 3)); sailG.computeVertexNormals();
  g.add(new THREE.Mesh(sailG, new THREE.MeshStandardMaterial({ color: col('#FFF8EE'), side: THREE.DoubleSide, flatShading: true })));
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.35), new THREE.MeshStandardMaterial({ color: col('#E2674C'), side: THREE.DoubleSide }));
  flag.position.set(0.4, 5.0, 0); g.add(flag);
  scene.add(g); return g;
})();

/* ---------- clouds & birds ---------- */
const cloudMat = new THREE.MeshStandardMaterial({ color: col('#FFE2D0'), flatShading: true, roughness: 1, emissive: col('#5A2E4A'), emissiveIntensity: 0.25 });
const clouds = [0.4, 1.3, 2.2, 3.4, 4.3, 5.4].map((a, i) => {
  const g = new THREE.Group();
  for (let k = 0; k < 5; k++) { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(4 + (k % 3) * 1.6, 1), cloudMat); s.position.set(k * 4.2 - 8, (k % 2) * 1.6, (k % 3) * 1.4); s.scale.y = 0.6; g.add(s); }
  g.userData = { a, r: 190 + (i % 3) * 30, y: 34 + (i % 2) * 12 }; scene.add(g); return g;
});
const birdMat = new THREE.MeshBasicMaterial({ color: col('#2A1E3A'), side: THREE.DoubleSide });
const birds = [0, 1, 2, 3, 4].map(i => {
  const g = new THREE.Group();
  [-1, 1].forEach(s => { const w = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.35), birdMat); w.geometry.translate(0.7, 0, 0); w.scale.x = s; w.name = 'w'; g.add(w); });
  scene.add(g); return g;
});

/* ---------- camera path ---------- */
const CAM = new THREE.CatmullRomCurve3([
  new THREE.Vector3(-6, 52, 74), new THREE.Vector3(30, 22, 48), new THREE.Vector3(46, 12, 8),
  new THREE.Vector3(30, 9, -34), new THREE.Vector3(4, 10, -50), new THREE.Vector3(-14, 13, -54)
]);
const LOOK = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 3, 0), new THREE.Vector3(0, 4, 0), new THREE.Vector3(-4, 4, 0), new THREE.Vector3(-8, 5, 2)]);

/* ---------- 2D overlay: titles ---------- */
const ui = document.getElementById('ui').getContext('2d');
function overlay(t) {
  ui.clearRect(0, 0, CFG.w, CFG.h);
  // gentle vignette
  const v = ui.createRadialGradient(960, 540, 400, 960, 540, 1150); v.addColorStop(0, 'rgba(20,10,40,0)'); v.addColorStop(1, 'rgba(20,10,40,.45)');
  ui.fillStyle = v; ui.fillRect(0, 0, CFG.w, CFG.h);
  const k = EZ.o3(seg(t, 0.5, 1.2)) * (1 - seg(t, 13.9, 14.4) * 0);
  ui.save(); ui.globalAlpha = k; ui.fillStyle = 'rgba(255,244,230,.9)'; ui.font = `600 24px ${MONO}`; ui.letterSpacing = '6px';
  ui.fillText(CFG.kicker, 96, 92); ui.restore();
  const o = EZ.o3(seg(t, 0.8, 1.6)) * (1 - seg(t, 3.6, 4.2));
  if (o > 0) {
    ui.save(); ui.globalAlpha = o; ui.fillStyle = '#FFF6EA'; ui.font = `700 132px ${DISPLAY}`; ui.letterSpacing = '-4px';
    ui.shadowColor = 'rgba(40,10,40,.45)'; ui.shadowBlur = 40; ui.fillText(CFG.open, 96, 980 + (1 - o) * 30); ui.restore();
  }
  const c = EZ.o3(seg(t, 12.2, 13.1));
  if (c > 0) {
    ui.save(); ui.globalAlpha = c; ui.fillStyle = '#FFF6EA'; ui.font = `700 120px ${DISPLAY}`; ui.letterSpacing = '-4px'; ui.textAlign = 'center';
    ui.shadowColor = 'rgba(40,10,40,.5)'; ui.shadowBlur = 50; ui.fillText(CFG.close, 960, 220 + (1 - c) * 24);
    ui.font = `600 22px ${MONO}`; ui.letterSpacing = '6px'; ui.shadowBlur = 0; ui.globalAlpha = EZ.o3(seg(t, 12.8, 13.5)) * 0.85;
    ui.fillText('BUILT FROM CODE  ·  NO 3D MODELS', 960, 280); ui.restore();
  }
}

/* ---------- the frame ---------- */
function render(t) {
  ocean.update(t);
  palms.forEach(({ crown, phase }) => { crown.rotation.z = 0.07 * Math.sin(t * 1.4 + phase); crown.rotation.x = 0.05 * Math.sin(t * 1.1 + phase * 2); });
  const ba = 2.1 - t * 0.075, br = 25;
  boat.position.set(Math.cos(ba) * br, 0.35 + 0.18 * Math.sin(t * 2.0), Math.sin(ba) * br);
  boat.rotation.set(0.05 * Math.sin(t * 1.7), -ba + Math.PI, 0.06 * Math.sin(t * 2.3));
  clouds.forEach(g => { const a = g.userData.a + t * 0.012; g.position.set(Math.cos(a) * g.userData.r, g.userData.y, Math.sin(a) * g.userData.r); g.lookAt(0, g.userData.y, 0); });
  birds.forEach((g, i) => {
    const p = (t * 0.06 + i * 0.018) % 1, a = -0.6 + p * 2.6;
    g.position.set(Math.cos(a) * (34 + i * 1.5), 18 + i * 0.8 + Math.sin(t * 1.3 + i) * 0.6, Math.sin(a) * (34 + i * 1.5) + i * 1.2);
    g.rotation.y = -a; const flap = 0.6 * Math.sin(t * 9 + i);
    g.children[0].rotation.x = flap; g.children[1].rotation.x = flap;
  });
  const p = EZ.io2(seg(t, 0, CFG.duration));
  camera.position.copy(CAM.getPoint(p));
  camera.lookAt(LOOK.getPoint(p));
  renderer.render(scene, camera);
  overlay(t);
}

/* ---------- master timeline: the only clock ---------- */
// Play on the wall clock even when frames are slow (software GL, a busy CI
// baker): lag smoothing would otherwise slow the timeline down and the
// preview-ready frame would never arrive.
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);
// Plugin previews may block bundled fonts; the fallback stack then renders the film.
document.fonts.load('700 100px Space').then(() => render(tl.time()), () => render(tl.time()));

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() { const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h); main.style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
// Inside an Open Design project the motion source player wraps the stage,
// fits it and adds its own controls; leave both to it there.
const hostPlayer = () => window.__odMotionSourcePlayer || main.parentElement.id !== 'viewport';
const ownFit = fit;
fit = function () { if (hostPlayer()) { main.style.transform = 'translate(-50%,-50%)'; return; } ownFit(); };
window.addEventListener('resize', fit); fit();
document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
  fit(); if (hostPlayer()) document.getElementById('controls').style.display = 'none';
}, 0));
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => { if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause(); sync(); });
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(6); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 6.0;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>

<script>
// A user gesture enables sound; the master timeline owns play, pause and seek.
(function() {
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';button.textContent='Sound on';button.setAttribute('aria-label','Enable sound');button.setAttribute('aria-pressed','false');controls.appendChild(button);
  let enabled=false,pending=false;
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;button.textContent='Sound on';button.setAttribute('aria-pressed','false');}).finally(()=>{pending=false;}); }
  button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(enabled));if(enabled){const tl=window.__timelines.main;if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    const tl=window.__timelines.main;
    if(enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
