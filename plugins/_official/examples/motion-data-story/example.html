<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<title>How long it took to add each billion people</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#FAFAF7; --ink:#111111; --red:#D7261E; --rule:#111111;
  --serif:"Playfair Display","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  --sans:"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --fs-title:64px; --fs-num:60px; --fs-label:28px; --fs-close:132px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#d9d9d4;font-family:var(--sans);color:var(--ink)}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;overflow:hidden}
#viewport{position:relative;overflow:hidden;background:var(--paper)}
#main{position:absolute;left:0;top:0;width:1920px;height:1080px;background:var(--paper);transform-origin:0 0;overflow:hidden}
.abs{position:absolute;white-space:nowrap}
#title{left:96px;top:72px;font:700 var(--fs-title)/1.12 var(--serif);letter-spacing:-.01em}
#kicker{left:96px;top:40px;font:600 var(--fs-label)/1 var(--sans);letter-spacing:.14em;text-transform:uppercase}
#dot{width:28px;height:28px;border-radius:50%;background:var(--red);left:946px;top:526px}
#axis{left:160px;top:538px;width:1600px;height:4px;background:var(--ink);transform-origin:0 50%}
.tick{width:3px;height:28px;background:var(--ink);top:527px}
.year{font:700 var(--fs-label)/1 var(--serif);transform:translateX(-50%);top:572px}
.bil{font:600 var(--fs-label)/1 var(--sans);transform:translateX(-50%);top:614px}
.bil.first{color:var(--ink)}
.cap{font:600 var(--fs-label)/1.2 var(--sans);left:96px;top:700px}
.br{height:4px;top:476px;background:var(--ink);transform-origin:0 50%}
.cp{width:3px;height:28px;top:464px;background:currentColor}
.num{font:700 var(--fs-num)/1 var(--serif);transform:translateX(-50%);top:392px;text-align:center}
.yrs{font:600 var(--fs-label)/1 var(--sans);transform:translateX(-50%);top:432px}
.row{left:96px;font:600 var(--fs-label)/1 var(--sans)}
.bar{height:20px;background:var(--ink);transform-origin:0 50%;left:520px}
.val{font:700 var(--fs-label)/1 var(--serif)}
#close{left:96px;top:380px;font:700 var(--fs-close)/1.05 var(--serif);letter-spacing:-.02em;white-space:normal;width:1700px}
#close em{font-style:normal;color:var(--red)}
#closeRule{left:96px;top:340px;width:240px;height:8px;background:var(--red);transform-origin:0 50%}
#controls{display:flex;gap:12px;align-items:center;font:600 16px var(--sans)}
#controls button{font:600 16px var(--sans);padding:8px 16px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid var(--red);outline-offset:2px}
#scrub{width:520px}

/* The existing OD export bridge marks frame capture; keep preview controls out. */
html.od-export body { margin:0!important; padding:0!important; gap:0!important; }
html.od-export #controls { display:none!important; }
html.od-export #viewport { position:fixed!important; inset:0!important; width:100vw!important; height:100vh!important; display:block!important; }
html.od-export #scaler, html.od-export #main { position:absolute!important; left:0!important; top:0!important; margin:0!important; transform:none!important; }
</style>
</head>
<body>
<div id="viewport">
<div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
  <div id="kicker" class="abs">World population</div>
  <div id="title" class="abs">How long it took to add<br>each billion people</div>
  <div id="axis" class="abs"></div>
  <div id="dot" class="abs"></div>
</div>
</div>
<div id="controls">
  <button id="play" type="button" aria-label="Play or pause">Pause</button>
  <button id="replay" type="button" aria-label="Replay from start">Replay</button>
  <input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Timeline position">
  <span id="time" aria-live="off">0.0 / 20.0 s</span>
</div>

<script src="assets/gsap.min.js"></script>
<script>
const CFG = {
  duration: 20,
  axisX0: 160, axisX1: 1760, axisY: 540,
  y0: 1804, y1: 2022,
  milestones: [1804,1927,1960,1974,1987,1999,2011,2022],
  gaps: [123,33,14,13,12,12,11]
};
const main = document.getElementById('main');
const px = y => CFG.axisX0 + (y - CFG.y0) * (CFG.axisX1 - CFG.axisX0) / (CFG.y1 - CFG.y0);
const add = (cls, html, css, id) => {
  const d = document.createElement('div');
  d.className = 'abs ' + cls; d.innerHTML = html;
  Object.assign(d.style, css || {});
  if (id) d.id = id;
  main.appendChild(d); return d;
};

// static scene elements
const ticks = [], years = [], bils = [];
CFG.milestones.forEach((y, i) => {
  const x = px(y);
  ticks.push(add('tick', '', {left: (x - 1.5) + 'px'}));
  years.push(add('year', String(y), {left: x + 'px'}));
  bils.push(add('bil', (i + 1) + 'B', {left: x + 'px', color: i === 0 ? 'var(--ink)' : 'var(--ink)'}));
});
const cap = add('cap', 'Year each billion was reached &nbsp;(B = billion people)');
const brs = [], cps = [], nums = [], yrs = [];
CFG.gaps.forEach((g, i) => {
  const a = px(CFG.milestones[i]), b = px(CFG.milestones[i + 1]);
  const mid = (a + b) / 2;
  brs.push(add('br', '', {left: a + 'px', width: (b - a) + 'px'}));
  cps.push([add('cp', '', {left: (a - 1.5) + 'px'}), add('cp', '', {left: (b - 1.5) + 'px'})]);
  nums.push(add('num', String(g), {left: mid + 'px'}));
  yrs.push(add('yrs', 'years', {left: mid + 'px'}));
});

// comparison bars
const rows = [], bars = [], vals = [];
const scaleBar = 1000 / 123, rowY0 = 740, pitch = 40;
CFG.gaps.forEach((g, i) => {
  const y = rowY0 + i * pitch;
  rows.push(add('row', (i + 1) + ' \u2192 ' + (i + 2) + ' billion', {top: y + 'px'}));
  bars.push(add('bar', '', {top: (y + 4) + 'px', width: (g * scaleBar) + 'px'}));
  vals.push(add('val', g + ' years', {left: (520 + g * scaleBar + 16) + 'px', top: y + 'px'}));
});

const closeRule = add('', '', {}, 'closeRule');
const closeEl = add('', 'From <em>123</em> years<br>to <em>11</em>.', {}, 'close');

// timeline
const tl = gsap.timeline({ paused: true });
const E_OUT = 'power3.out', E_IN = 'power2.in';

gsap.set([ticks, years, bils, cap, brs, cps.flat(), nums, yrs, rows, bars, vals, closeRule, closeEl], {opacity: 0});
gsap.set('#axis', {scaleX: 0});
gsap.set([brs, bars, closeRule], {scaleX: 0});
gsap.set('#dot', {opacity: 0, scale: 0});
gsap.set('#title, #kicker', {opacity: 0});

// 0-2s dot + title
tl.fromTo('#dot', {opacity: 0, scale: 0}, {opacity: 1, scale: 1, duration: .5, ease: 'back.out(2)'}, .2);
tl.to('#kicker', {opacity: 1, duration: .5, ease: E_OUT}, .8);
tl.fromTo('#title', {opacity: 0, y: 24}, {opacity: 1, y: 0, duration: .65, ease: E_OUT}, 1);
// dot travels to axis origin
tl.to('#dot', {left: (CFG.axisX0 - 14) + 'px', top: (CFG.axisY - 12) + 'px', duration: .8, ease: 'power2.inOut'}, 1.9);
// 2.5-4.5 axis, then ticks
tl.to('#axis', {scaleX: 1, duration: 1.2, ease: 'power2.inOut'}, 2.6);
tl.fromTo(ticks, {opacity: 0}, {opacity: 1, duration: .2, stagger: .13}, 2.7);
tl.fromTo([years, bils], {opacity: 0, y: 8}, {opacity: 1, y: 0, duration: .3, ease: E_OUT, stagger: .06}, 2.9);
tl.fromTo(cap, {opacity: 0}, {opacity: 1, duration: .4}, 3.9);
tl.to('#dot', {opacity: 0, duration: .3}, 3.9);

// gaps: first at 4.5, rest from 7.5
const start = i => i === 0 ? 4.5 : 7.5 + (i - 1) * 1.1;
const RED = '#D7261E', INK = '#111111';
CFG.gaps.forEach((g, i) => {
  const t = start(i), d = i === 0 ? 1.1 : .5;
  const grp = [brs[i], ...cps[i], nums[i], yrs[i]];
  tl.set(grp, {color: RED}, t);
  tl.set(brs[i], {backgroundColor: RED}, t);
  tl.fromTo(cps[i], {opacity: 0}, {opacity: 1, duration: .15}, t);
  tl.fromTo(brs[i], {opacity: 1, scaleX: 0}, {opacity: 1, scaleX: 1, duration: d, ease: 'power2.inOut'}, t);
  tl.fromTo(nums[i], {opacity: 0, y: 16}, {opacity: 1, y: 0, duration: .45, ease: E_OUT}, t + d - .1);
  tl.fromTo(yrs[i], {opacity: 0}, {opacity: 1, duration: .3}, t + d + .1);
  if (i < CFG.gaps.length - 1) {
    const tn = start(i + 1);
    tl.set(grp, {color: INK}, tn);
    tl.set(brs[i], {backgroundColor: INK}, tn);
  }
});

// 14.2-17.2 comparison bars
tl.to(cap, {opacity: 0, duration: .3}, 14.1);
CFG.gaps.forEach((g, i) => {
  const t = 14.4 + i * .18;
  tl.fromTo(rows[i], {opacity: 0, x: -12}, {opacity: 1, x: 0, duration: .3, ease: E_OUT}, t);
  tl.set(bars[i], {backgroundColor: i === 0 || i === 6 ? RED : INK}, 0);
  tl.fromTo(bars[i], {opacity: 1, scaleX: 0}, {opacity: 1, scaleX: 1, duration: .6, ease: E_OUT}, t);
  tl.fromTo(vals[i], {opacity: 0}, {opacity: 1, duration: .3}, t + .45);
  tl.set(vals[i], {color: i === 0 || i === 6 ? RED : INK}, 0);
});

// 17.2 clear stage, 17.5-20 closing
const gone = [ticks, years, bils, brs, cps.flat(), nums, yrs, rows, bars, vals, '#axis', '#title', '#kicker'];
tl.to(gone, {opacity: 0, duration: .3, ease: E_IN}, 17.1);
tl.fromTo(closeRule, {opacity: 1, scaleX: 0}, {opacity: 1, scaleX: 1, duration: .5, ease: E_OUT}, 17.5);
tl.fromTo(closeEl, {opacity: 0, y: 30}, {opacity: 1, y: 0, duration: .7, ease: E_OUT}, 17.6);

// master clock
const clock = {t: 0};
tl.to(clock, {t: CFG.duration, duration: CFG.duration, ease: 'none'}, 0);
window.__timelines = {main: tl};

// preview scaling + controls (outside composition)
const vp = document.getElementById('viewport');
function fit() {
  const s = Math.min((innerWidth - 32) / 1920, (innerHeight - 80) / 1080);
  vp.style.width = (1920 * s) + 'px'; vp.style.height = (1080 * s) + 'px';
  main.style.transform = 'scale(' + s + ')';
}
addEventListener('resize', fit); fit();

const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
tl.eventCallback('onUpdate', () => {
  scrub.value = tl.time();
  timeEl.textContent = tl.time().toFixed(1) + ' / 20.0 s';
});
tl.eventCallback('onComplete', () => { playBtn.textContent = 'Play'; });
playBtn.onclick = () => {
  if (tl.paused() || tl.progress() >= 1) { if (tl.progress() >= 1) tl.restart(); else tl.play(); playBtn.textContent = 'Pause'; }
  else { tl.pause(); playBtn.textContent = 'Play'; }
};
document.getElementById('replay').onclick = () => { tl.restart(); playBtn.textContent = 'Pause'; };
scrub.oninput = () => { tl.pause(); tl.time(parseFloat(scrub.value)); playBtn.textContent = 'Play'; };

if (reduce) { tl.time(CFG.duration); playBtn.textContent = 'Play'; }
else { tl.play(); }
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame (11s).
(function () {
  var POSTER_AT = 11;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
</body>
</html>
