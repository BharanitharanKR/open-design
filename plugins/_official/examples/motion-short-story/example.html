<!DOCTYPE html>
<html lang="en" data-od-preview-ready="false">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Little Dot — a 15-second animated short</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Space;src:url('assets/space-grotesk.ttf') format('truetype');font-weight:300 700;font-display:block}
:root{--bg:#1D2142;--accent:#FF8A3D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
#viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
#main{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:var(--bg);overflow:hidden}
#main canvas{display:block;width:1920px;height:1080px}
#controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:14px;width:min(900px,92vw);padding:12px 18px;border-radius:14px;background:#101214dd;color:#fff;font:600 13px ui-monospace,Menlo,monospace;opacity:0;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{font:inherit;letter-spacing:.06em;background:var(--accent);color:#1D2142;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-width:88px}
#controls button:focus-visible,#scrub:focus-visible{outline:3px solid #fff;outline-offset:2px}
#scrub{flex:1;accent-color:var(--accent)}
#tc{min-width:110px;text-align:right;font-variant-numeric:tabular-nums}
html.od-export #controls{display:none!important}
html.od-export #main{left:0!important;top:0!important;transform:none!important}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080">
    <canvas id="stage" width="1920" height="1080"></canvas>
  </div>
</div>
<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause">PAUSE</button>
  <input id="scrub" type="range" min="0" max="15" step="0.01" value="0" aria-label="Timeline position">
  <span id="tc">0.00 / 15.00</span>
</div>

<script>
/* ============================================================
   The Little Dot — a wordless 15-second animated short.
   A small dot wants to reach a star; its friends build the way.
   Character animation uses classic principles (anticipation,
   squash and stretch, follow-through) driven only by timeline time.
   ============================================================ */
const CFG = {
  duration: 15, w: 1920, h: 1080, ground: 860,
  skyTop: '#1D2142', skyMid: '#5B3F78', skyLow: '#F2A65A', hill: '#2C2350', hill2: '#3B2C62', groundCol: '#241C40',
  hero: { color: '#FF8A3D', r: 72 },
  friends: [ // color, start x, side it arrives from, arrival time
    { color: '#4ECDC4', x: 1010, from: 2100, at: 5.7 },
    { color: '#FFD166', x: 520, from: -200, at: 6.05 },
    { color: '#EF476F', x: 1210, from: 2100, at: 6.4 },
    { color: '#7B8CDE', x: 360, from: -200, at: 6.75 }
  ],
  friendR: 60, star: { x: 1200, y: 214 }, towerX: 1200,
  title: 'Higher, together.', sub: 'THE LITTLE DOT · A TINY STORY IN CODE'
};
const DISPLAY = 'Space, "Avenir Next", "Helvetica Neue", Arial, sans-serif';
const MONO = 'ui-monospace, Menlo, Consolas, monospace';
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const E = n => gsap.parseEase(n);
const EZ = { o3: E('power3.out'), i3: E('power3.in'), io3: E('power3.inOut'), io2: E('power2.inOut'), o2: E('power2.out'), back: E('back.out(1.6)') };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;
function rnd(i) { const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453; return s - Math.floor(s); }

/* ---------- animation primitives ---------- */
// a hop from (x0, y0) to (x1, y1) with apex height h, plus squash/stretch along the way
function hop(t, t0, dur, x0, y0, x1, y1, h) {
  const p = seg(t, t0, t0 + dur);
  const x = lerp(x0, x1, EZ.io2(p));
  const y = lerp(y0, y1, p) - h * 4 * p * (1 - p);
  const before = seg(t, t0 - 0.16, t0), after = t - (t0 + dur);
  let sy = 1;
  if (t < t0 && before > 0) sy = 1 - 0.22 * Math.sin(before * Math.PI / 2);          // anticipation
  else if (p > 0 && p < 1) sy = 1 + 0.22 * Math.sin(p * Math.PI) * (p < 0.5 ? 1 : 0.6); // stretch in the air
  else if (after >= 0) sy = 1 - 0.28 * Math.exp(-after * 9) * Math.cos(after * 22);      // landing squash, settling
  return { x, y, sy, airborne: p > 0 && p < 1, done: p >= 1 };
}
// chain several hops into one path; keys = [t0, dur, x1, y1, h]
function path(t, start, keys) {
  let s = { x: start[0], y: start[1], sy: 1 };
  for (const [t0, dur, x1, y1, h] of keys) {
    if (t < t0 - 0.16) return s.sy === undefined ? { ...s, sy: 1 } : s;
    s = hop(t, t0, dur, s.x, s.y, x1, y1, h);
    if (!s.done) return s;
    const settle = s.sy; s = { x: x1, y: y1, sy: settle };
  }
  return s;
}

/* ---------- characters ---------- */
function blob(x, y, r, sy, color, look, blink, mood) {
  const sx = 1 / Math.sqrt(sy);
  ctx.save(); ctx.translate(x, y);
  // contact shadow
  ctx.fillStyle = 'rgba(10,6,24,.35)'; ctx.beginPath(); ctx.ellipse(0, 4, r * sx * 0.9, r * 0.16, 0, 0, TAU); ctx.fill();
  ctx.scale(sx, sy);
  // body with a soft rim light from the star
  const g = ctx.createRadialGradient(-r * 0.35, -r * 1.45, r * 0.2, 0, -r, r * 1.2);
  g.addColorStop(0, '#FFFFFF55'); g.addColorStop(0.35, color); g.addColorStop(1, color);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -r, r, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.arc(0, -r, r, 0.15 * Math.PI, 0.85 * Math.PI); ctx.fill();
  // eyes
  const ex = r * 0.3, ey = -r * 1.12, ew = r * 0.17, eh = r * 0.24 * (1 - blink * 0.92);
  [-1, 1].forEach(side => {
    const cx = side * ex + look[0] * r * 0.1, cy = ey + look[1] * r * 0.06;
    if (mood === 'happy') {
      ctx.strokeStyle = '#1A1230'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(cx, cy + ew * 0.5, ew * 0.9, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else if (mood === 'ouch') {
      ctx.strokeStyle = '#1A1230'; ctx.lineWidth = r * 0.07; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(cx - side * ew, cy - ew * 0.8); ctx.lineTo(cx + side * ew * 0.6, cy); ctx.lineTo(cx - side * ew, cy + ew * 0.8); ctx.stroke();
    } else {
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(cx, cy, ew, Math.max(1.5, eh), 0, 0, TAU); ctx.fill();
      if (blink < 0.7) {
        ctx.fillStyle = '#1A1230'; ctx.beginPath(); ctx.ellipse(cx + look[0] * ew * 0.4, cy + look[1] * eh * 0.4, ew * 0.55, Math.max(1, eh * 0.55), 0, 0, TAU); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(cx + look[0] * ew * 0.4 + ew * 0.2, cy + look[1] * eh * 0.4 - eh * 0.25, ew * 0.16, 0, TAU); ctx.fill();
      }
    }
  });
  // cheeks
  ctx.fillStyle = 'rgba(255,120,140,.35)';
  [-1, 1].forEach(side => { ctx.beginPath(); ctx.ellipse(side * r * 0.55, -r * 0.82, r * 0.13, r * 0.08, 0, 0, TAU); ctx.fill(); });
  ctx.restore();
}
const blinkAt = (t, times) => times.reduce((b, at) => Math.max(b, 1 - Math.abs(t - at) / 0.09), 0);

/* ---------- world ---------- */
function sky(t) {
  const g = ctx.createLinearGradient(0, 0, 0, CFG.ground);
  g.addColorStop(0, CFG.skyTop); g.addColorStop(0.62, CFG.skyMid); g.addColorStop(1, CFG.skyLow);
  ctx.fillStyle = g; ctx.fillRect(0, 0, CFG.w, CFG.h);
  for (let i = 0; i < 70; i++) { // background stars
    const x = rnd(i) * CFG.w, y = rnd(i + 99) * 520, tw = 0.35 + 0.65 * Math.abs(Math.sin(t * (0.8 + rnd(i + 7)) + i));
    ctx.fillStyle = `rgba(255,240,220,${0.25 * tw})`; ctx.fillRect(x, y, 3, 3);
  }
  // rolling hills
  ctx.fillStyle = CFG.hill2; ctx.beginPath(); ctx.moveTo(0, 760);
  for (let x = 0; x <= CFG.w; x += 40) ctx.lineTo(x, 740 - 60 * Math.sin(x / 300 + 1) - 30 * Math.sin(x / 130));
  ctx.lineTo(CFG.w, CFG.h); ctx.lineTo(0, CFG.h); ctx.fill();
  ctx.fillStyle = CFG.hill; ctx.beginPath(); ctx.moveTo(0, 820);
  for (let x = 0; x <= CFG.w; x += 40) ctx.lineTo(x, 810 - 36 * Math.sin(x / 220 + 2));
  ctx.lineTo(CFG.w, CFG.h); ctx.lineTo(0, CFG.h); ctx.fill();
  ctx.fillStyle = CFG.groundCol; ctx.fillRect(0, CFG.ground, CFG.w, CFG.h - CFG.ground);
}
function star(t, lit) {
  const { x, y } = CFG.star;
  const tw = 1 + 0.08 * Math.sin(t * 5);
  const R = (34 + 10 * lit) * tw;
  const glow = ctx.createRadialGradient(x, y, 0, x, y, R * (4 + 10 * lit));
  glow.addColorStop(0, `rgba(255,236,170,${0.55 + 0.4 * lit})`); glow.addColorStop(1, 'rgba(255,236,170,0)');
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, R * (4 + 10 * lit), 0, TAU); ctx.fill();
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.3); ctx.fillStyle = '#FFF2C4';
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i / 10 * TAU - Math.PI / 2, rr = i % 2 ? R * 0.45 : R; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
  if (lit > 0) { // rays
    ctx.save(); ctx.globalAlpha = lit * 0.5; ctx.strokeStyle = '#FFE8A8'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 12; i++) { const a = i / 12 * TAU + t * 0.2, r0 = 70, r1 = 70 + 160 * lit; ctx.beginPath(); ctx.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); ctx.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); ctx.stroke(); }
    ctx.restore();
  }
}

/* ---------- the story ---------- */
const STACK_H = CFG.friendR * 2 - 4;
function friendState(t, i) {
  const f = CFG.friends[i];
  const topY = CFG.ground - i * STACK_H;
  const keys = [
    [f.at, 0.42, lerp(f.from, f.x, 0.5), CFG.ground, 90],
    [f.at + 0.45, 0.4, f.x, CFG.ground, 70],
    [7.5 + i * 0.12, 0.25, f.x, CFG.ground, 40],               // excited bounce
    [8.1 + i * 0.42, 0.42, CFG.towerX, topY, 220 + i * 40]     // build the tower
  ];
  const s = path(t, [f.from, CFG.ground], keys);
  let look = [Math.sign(760 - s.x) * 0.8, 0];
  if (t > 8.1 + i * 0.42) look = [0, -0.6];
  if (t > 10.0) look = [-0.2, -1];
  return { ...s, look };
}
function heroState(t) {
  const g = CFG.ground, top = CFG.ground - CFG.friends.length * STACK_H;
  const keys = [
    [0.55, 0.36, 120, g, 70], [0.95, 0.36, 380, g, 80], [1.35, 0.4, 760, g, 90], // arrives
    [2.55, 0.5, 760, g, 150],                                                 // first try
    [3.45, 0.85, 760, g, 340],                                                // big try
    [9.95, 0.6, CFG.towerX, top, 360]                                          // up the tower
  ];
  const s = path(t, [-160, g], keys);
  // looking: at the star, down when sad, around at the friends
  let look = [0.6, 0];
  if (t > 1.8) look = [lerp(0.6, 0.7, seg(t, 1.8, 2.1)), lerp(0, -1, EZ.o3(seg(t, 1.8, 2.1)))];
  if (t > 4.4) look = [0, lerp(-1, 1, EZ.o3(seg(t, 4.4, 4.9)))];
  if (t > 5.8) look = [lerp(1, -1, (Math.sin((t - 5.8) * 3) + 1) / 2), 0];
  if (t > 8.0) look = [1, -0.5];
  if (t > 10.5) look = [0.3, -1];
  // sad droop after the fall, then a stretch to touch the star
  let sy = s.sy;
  if (t > 4.6 && t < 5.9) sy *= 1 - 0.12 * EZ.o3(seg(t, 4.6, 5.0)) * (1 - seg(t, 5.6, 5.9));
  const reach = EZ.back(seg(t, 10.75, 11.25)) * (1 - 0.6 * EZ.io3(seg(t, 11.6, 12.2)));
  if (t > 10.6) sy *= 1 + 0.42 * reach;
  let mood = 'normal';
  if (t > 4.3 && t < 4.85) mood = 'ouch';
  if (t > 11.35) mood = 'happy';
  return { ...s, sy, look, mood, blink: blinkAt(t, [2.1, 5.2, 7.9, 9.7]) };
}

function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  sky(t);
  const lit = EZ.o3(seg(t, 11.25, 11.8));
  star(t, lit);
  // friends (drawn bottom of tower first)
  const fr = CFG.friends.map((f, i) => ({ i, f, s: friendState(t, i) }));
  fr.sort((a, b) => b.s.y - a.s.y);
  for (const { i, f, s } of fr) {
    if (t < f.at - 0.2) continue;
    // joyful wobble in the tower once the star lights up
    const wob = t > 11.4 ? Math.sin((t - 11.4) * 7 + i) * 6 * Math.exp(-(t - 11.4) * 0.8) : 0;
    blob(s.x + wob, s.y, CFG.friendR, s.sy, f.color, s.look, blinkAt(t, [8.7 + i * 0.3, 12.6 + i * 0.2]), t > 11.5 ? 'happy' : 'normal');
  }
  const h = heroState(t);
  const wob = t > 11.4 ? Math.sin((t - 11.4) * 7 + 5) * 8 * Math.exp(-(t - 11.4) * 0.8) : 0;
  blob(h.x + wob, h.y, CFG.hero.r, h.sy, CFG.hero.color, h.look, h.blink, h.mood);
  // tiny dust puffs on hard landings
  [[4.3, 760], [1.75, 760]].forEach(([at, x], k) => {
    const p = seg(t, at, at + 0.5);
    if (p <= 0 || p >= 1) return;
    ctx.fillStyle = `rgba(255,220,200,${0.5 * (1 - p)})`;
    for (let i = 0; i < 6; i++) { const a = Math.PI + (i / 5) * Math.PI; ctx.beginPath(); ctx.arc(x + Math.cos(a) * (60 + 90 * p) * (i < 3 ? 1 : -1) * 0.9, CFG.ground - 10 - 30 * p * Math.sin(i), 10 * (1 - p) + 4, 0, TAU); ctx.fill(); }
  });
  // sparkles after the touch
  if (t > 11.3) for (let i = 0; i < 26; i++) {
    const p = ((t - 11.3) * 0.35 + rnd(i)) % 1, a = rnd(i + 3) * TAU, d = 80 + p * 420;
    ctx.fillStyle = `rgba(255,236,170,${(1 - p) * 0.9 * lit})`;
    ctx.fillRect(CFG.star.x + Math.cos(a) * d, CFG.star.y + Math.sin(a) * d, 5, 5);
  }
  // title
  const ti = EZ.o3(seg(t, 12.6, 13.4));
  if (ti > 0) {
    ctx.save(); ctx.globalAlpha = ti; ctx.fillStyle = '#FFF4E0'; ctx.font = `700 112px ${DISPLAY}`; ctx.textAlign = 'left';
    ctx.letterSpacing = '-3px'; ctx.fillText(CFG.title, 160, 420 + (1 - ti) * 30);
    ctx.font = `600 24px ${MONO}`; ctx.letterSpacing = '6px'; ctx.fillStyle = 'rgba(255,244,224,.7)';
    ctx.globalAlpha = EZ.o3(seg(t, 13.1, 13.7)); ctx.fillText(CFG.sub, 166, 490);
    ctx.restore();
  }
  // fade from and to night
  const fade = 1 - EZ.o2(seg(t, 0, 0.7));
  if (fade > 0) { ctx.fillStyle = `rgba(10,8,24,${fade})`; ctx.fillRect(0, 0, CFG.w, CFG.h); }
}

/* ---------- master timeline: the only clock ---------- */
// Play on the wall clock even when frames are slow (software GL, a busy CI
// baker): lag smoothing would otherwise slow the timeline down and the
// preview-ready frame would never arrive.
gsap.ticker.lagSmoothing(0);
const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };
tl.to(clock, { t: CFG.duration, duration: CFG.duration, ease: 'none' }, 0);
tl.eventCallback('onUpdate', () => render(tl.time()));
window.__timelines = { main: tl };
render(0);
// Plugin previews may block bundled fonts; the fallback stack then renders the film.
document.fonts.load('700 100px Space').then(() => render(tl.time()), () => render(tl.time()));

/* ---------- preview shell (outside the composition) ---------- */
const main = document.getElementById('main');
const playBtn = document.getElementById('playBtn'), scrub = document.getElementById('scrub'), tcEl = document.getElementById('tc');
function fit() { const s = Math.min(window.innerWidth / CFG.w, window.innerHeight / CFG.h); main.style.transform = 'translate(-50%,-50%) scale(' + s + ')'; }
window.addEventListener('resize', fit); fit();
function sync() {
  const t = tl.time();
  scrub.value = t; tcEl.textContent = t.toFixed(2) + ' / ' + CFG.duration.toFixed(2);
  playBtn.textContent = tl.isActive() ? 'PAUSE' : (t >= CFG.duration - 0.01 ? 'REPLAY' : 'PLAY');
}
gsap.ticker.add(sync);
playBtn.addEventListener('click', () => { if (tl.time() >= CFG.duration - 0.01) tl.restart(); else if (tl.paused()) tl.play(); else tl.pause(); sync(); });
scrub.addEventListener('input', () => { tl.pause(); tl.time(parseFloat(scrub.value)); sync(); });
window.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); playBtn.click(); } });
const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { tl.pause(); tl.time(12.0); }
else document.fonts.ready.then(() => tl.play(0));
sync();
</script>
<script>
// Video export seeks with timeline callbacks suppressed, so the onUpdate
// drawing also runs from a per-frame loop whenever the timeline time moves.
(function install() {
  var tls = window.__timelines;
  var tl = tls && tls[Object.keys(tls)[0]];
  if (!tl) { setTimeout(install, 50); return; }
  var draw = tl.eventCallback('onUpdate');
  if (!draw) return;
  var drawnAt = null;
  tl.eventCallback('onUpdate', function () { drawnAt = tl.time(); return draw.apply(this, arguments); });
  (function loop() {
    if (window.__odFrameRenderer && !document.documentElement.classList.contains('od-export')) {
      document.documentElement.classList.add('od-export');
    }
    var t = tl.time();
    if (t !== drawnAt) { drawnAt = t; draw(); }
    requestAnimationFrame(loop);
  })();
})();
</script>
<script>
// Preview bake: mark ready once the timeline reaches the poster frame.
(function () {
  var POSTER_AT = 12.0;
  function check() {
    var tls = window.__timelines;
    var tl = tls && tls[Object.keys(tls)[0]];
    if (tl && tl.time() >= POSTER_AT) {
      document.documentElement.setAttribute('data-od-preview-ready', 'true');
      return;
    }
    requestAnimationFrame(check);
  }
  requestAnimationFrame(check);
})();
</script>
<audio id="soundtrack" src="assets/soundtrack.mp3" data-start="0" data-duration="15" data-track-index="2" data-volume="1" preload="auto"></audio>
<script>
// A user gesture enables sound; the master timeline owns play, pause and seek.
(function() {
  const audio=document.getElementById('soundtrack');
  if (!audio || typeof audio.play !== 'function' || window.__odFrameRenderer) return;
  const controls=document.getElementById('controls');
  const button=document.createElement('button');button.type='button';button.textContent='Sound on';button.setAttribute('aria-label','Enable sound');button.setAttribute('aria-pressed','false');controls.appendChild(button);
  let enabled=false,pending=false;
  function play() { if(pending||!audio.paused)return;pending=true;audio.play().catch(()=>{enabled=false;button.textContent='Sound on';button.setAttribute('aria-pressed','false');}).finally(()=>{pending=false;}); }
  button.onclick=()=>{enabled=!enabled;button.textContent=enabled?'Sound off':'Sound on';button.setAttribute('aria-pressed',String(enabled));if(enabled){const tl=window.__timelines.main;if(tl.progress()>=1)tl.restart();else tl.play();audio.currentTime=tl.time();play();}else audio.pause();};
  document.getElementById('scrub').addEventListener('input',event=>{if(enabled)audio.currentTime=Number(event.target.value);});
  function sync() {
    const tl=window.__timelines.main;
    if(enabled&&!window.__odFrameRenderer){
      if(!pending&&!audio.seeking&&audio.readyState>=3&&Math.abs(audio.currentTime-tl.time())>.3)audio.currentTime=tl.time();
      if(tl.paused()||tl.progress()>=1)audio.pause();else play();
    }else audio.pause();
    requestAnimationFrame(sync);
  }sync();
})();
</script>
